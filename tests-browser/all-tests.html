<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assign-gingerly - Browser Tests</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .results {
            background: white;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .pass { color: #4caf50; }
        .fail { color: #f44336; }
        .test-item {
            padding: 8px;
            margin: 5px 0;
            border-left: 4px solid #ddd;
            background: #f9f9f9;
        }
        .test-item.pass { border-left-color: #4caf50; }
        .test-item.fail { border-left-color: #f44336; }
        .error { color: #f44336; font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>assign-gingerly - Browser Tests</h1>
    
    <div class="info">
        <strong>Browser:</strong> <span id="browser-info"></span><br>
        <strong>getOrInsertComputed:</strong> <span id="polyfill-info"></span>
    </div>
    
    <div class="results">
        <h2>Test Results</h2>
        <div id="summary"></div>
        <div id="test-list"></div>
    </div>

    <script type="module">
        import assignGingerly, { EnhancementRegistry } from '../assignGingerly.js';
        import { assignTentatively } from '../assignTentatively.js';

        // Display browser info
        document.getElementById('browser-info').textContent = navigator.userAgent;
        const hasNative = typeof WeakMap.prototype.getOrInsertComputed === 'function';
        document.getElementById('polyfill-info').textContent = hasNative ? '✓ Native support' : '⚠ Polyfill';

        // Simple test framework
        const tests = [];
        let currentTest = null;

        function test(name, fn) {
            tests.push({ name, fn });
        }

        function assert_equals(actual, expected, message = '') {
            if (actual !== expected) {
                throw new Error(`${message}\nExpected: ${expected}\nActual: ${actual}`);
            }
        }

        function assert_true(value, message = '') {
            if (value !== true) {
                throw new Error(`${message}\nExpected true, got: ${value}`);
            }
        }

        function assert_array_equals(actual, expected, message = '') {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`${message}\nExpected: ${JSON.stringify(expected)}\nActual: ${JSON.stringify(actual)}`);
            }
        }

        // ===== TESTS =====

        // Basic Functionality
        test('Basic: object assignment', () => {
            const target = { hello: 'world' };
            assignGingerly(target, { hello: 'Venus', foo: 'bar' });
            assert_equals(target.hello, 'Venus');
            assert_equals(target.foo, 'bar');
        });

        test('Basic: empty source object', () => {
            const target = { existing: 'value' };
            assignGingerly(target, {});
            assert_equals(target.existing, 'value');
        });

        test('Basic: multiple key-value pairs', () => {
            const target = {};
            assignGingerly(target, { name: 'John', age: 30, email: 'john@example.com' });
            assert_equals(target.name, 'John');
            assert_equals(target.age, 30);
            assert_equals(target.email, 'john@example.com');
        });

        test('Basic: preserve existing properties', () => {
            const target = { existing: 'value' };
            assignGingerly(target, { new: 'property' });
            assert_equals(target.existing, 'value');
            assert_equals(target.new, 'property');
        });

        test('Basic: overwrite properties', () => {
            const target = { value: 'old' };
            assignGingerly(target, { value: 'new' });
            assert_equals(target.value, 'new');
        });

        test('Basic: handle non-object values', () => {
            assignGingerly(null, { hello: 'world' });
            assignGingerly(undefined, { hello: 'world' });
            assert_true(true); // Should not throw
        });

        // Nested Paths
        test('Nested: create intermediate objects', () => {
            const target = {};
            assignGingerly(target, { '?.level1?.level2': 'value' });
            assert_equals(target.level1.level2, 'value');
        });

        test('Nested: deeply nested paths', () => {
            const target = {};
            assignGingerly(target, { '?.a?.b?.c?.d?.e': 'deep' });
            assert_equals(target.a.b.c.d.e, 'deep');
        });

        test('Nested: multiple nested paths', () => {
            const target = {};
            assignGingerly(target, {
                '?.user?.name': 'John',
                '?.user?.age': 30,
                '?.settings?.theme': 'dark'
            });
            assert_equals(target.user.name, 'John');
            assert_equals(target.user.age, 30);
            assert_equals(target.settings.theme, 'dark');
        });

        // Dependency Injection
        test('DI: EnhancementRegistry', () => {
            const registry = new EnhancementRegistry();
            assert_true(registry instanceof EnhancementRegistry);
        });

        test('DI: push multiple items', () => {
            const registry = new EnhancementRegistry();
            const sym1 = Symbol.for('sym1');
            const sym2 = Symbol.for('sym2');
            
            class Class1 { value = 1; }
            class Class2 { value = 2; }
            
            registry.push([
                { symlinks: { [sym1]: 'val1' }, spawn: Class1 },
                { symlinks: { [sym2]: 'val2' }, spawn: Class2 }
            ]);
            
            assert_equals(registry.getItems().length, 2);
        });

        test('DI: find by symbol', () => {
            const registry = new EnhancementRegistry();
            const testSymbol = Symbol.for('test-symbol');
            
            class TestClass { value = 'test'; }
            
            registry.push({ symlinks: { [testSymbol]: 'value' }, spawn: TestClass });
            
            const found = registry.findBySymbol(testSymbol);
            assert_true(found !== undefined);
            assert_equals(found.spawn, TestClass);
        });

        // += Command
        test('+= Command: increment existing value', () => {
            const target = { count: 5 };
            assignGingerly(target, { 'count+=': 3 });
            assert_equals(target.count, 8);
        });

        test('+= Command: non-existent path', () => {
            const target = {};
            assignGingerly(target, { 'count+=': 10 });
            assert_equals(target.count, 10);
        });

        test('+= Command: string concatenation', () => {
            const target = { str: 'Hello' };
            assignGingerly(target, { 'str+=': ' World' });
            assert_equals(target.str, 'Hello World');
        });

        // =! Command
        test('=! Command: toggle false to true', () => {
            const target = { flag: false };
            assignGingerly(target, { 'flag=!': '.' });
            assert_equals(target.flag, true);
        });

        test('=! Command: toggle true to false', () => {
            const target = { flag: true };
            assignGingerly(target, { 'flag=!': '.' });
            assert_equals(target.flag, false);
        });

        // -= Command
        test('-= Command: delete single property', () => {
            const target = { a: 1, b: 2, c: 3 };
            assignGingerly(target, { '-=': 'b' });
            assert_equals(target.a, 1);
            assert_equals(target.b, undefined);
            assert_equals(target.c, 3);
        });

        test('-= Command: delete multiple properties', () => {
            const target = { a: 1, b: 2, c: 3 };
            assignGingerly(target, { '-=': ['a', 'c'] });
            assert_equals(target.a, undefined);
            assert_equals(target.b, 2);
            assert_equals(target.c, undefined);
        });

        // assignTentatively
        test('Tentatively: basic assignment', () => {
            const target = {};
            const reversal = assignTentatively(target, { a: 1, b: 2 });
            assert_equals(target.a, 1);
            assert_equals(target.b, 2);
            assert_true(reversal !== undefined);
        });

        test('Tentatively: reversal', () => {
            const target = {};
            const reversal = assignTentatively(target, { a: 1, b: 2 });
            assignGingerly(target, reversal);
            assert_equals(target.a, undefined);
            assert_equals(target.b, undefined);
        });

        // Edge Cases
        test('Edge: arrays as values', () => {
            const target = {};
            assignGingerly(target, { arr: [1, 2, 3] });
            assert_array_equals(target.arr, [1, 2, 3]);
        });

        test('Edge: null and undefined', () => {
            const target = {};
            assignGingerly(target, { nullVal: null, undefinedVal: undefined });
            assert_equals(target.nullVal, null);
            assert_equals(target.undefinedVal, undefined);
        });

        // ===== RUN TESTS =====

        async function runTests() {
            const results = {
                total: tests.length,
                passed: 0,
                failed: 0,
                failures: []
            };

            const testList = document.getElementById('test-list');

            for (const test of tests) {
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                
                try {
                    await test.fn();
                    results.passed++;
                    testItem.classList.add('pass');
                    testItem.innerHTML = `<span class="pass">✓</span> ${test.name}`;
                } catch (error) {
                    results.failed++;
                    results.failures.push({ name: test.name, error: error.message });
                    testItem.classList.add('fail');
                    testItem.innerHTML = `<span class="fail">✗</span> ${test.name}<br><span class="error">${error.message}</span>`;
                }
                
                testList.appendChild(testItem);
            }

            // Update summary
            const summary = document.getElementById('summary');
            const passRate = ((results.passed / results.total) * 100).toFixed(1);
            summary.innerHTML = `
                <strong>Total:</strong> ${results.total} |
                <strong class="pass">Passed:</strong> ${results.passed} |
                <strong class="fail">Failed:</strong> ${results.failed} |
                <strong>Pass Rate:</strong> ${passRate}%
            `;

            // Make results available to Playwright
            window.testsComplete = true;
            window.testResults = results;

            console.log('Test Results:', results);
        }

        runTests();
    </script>
</body>
</html>
