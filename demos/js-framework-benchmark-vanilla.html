<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vanilla JS — JS Framework Benchmark (Baseline)</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1rem; }
        .controls { margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button { padding: 0.4rem 0.8rem; cursor: pointer; }
        #results { margin: 1rem 0; font-family: monospace; white-space: pre-wrap; background: #f8f8f8; padding: 1rem; border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { padding: 0.25rem 0.5rem; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Vanilla JS — Benchmark (Baseline)</h1>
    <p>Pure DOM manipulation — no framework, no assignFrom. Use as a performance floor.</p>

    <div class="controls">
        <button id="btn-create">Create 1,000</button>
        <button id="btn-create10k">Create 10,000</button>
        <button id="btn-append">Append 1,000</button>
        <button id="btn-update">Update every 10th</button>
        <button id="btn-swap">Swap rows</button>
        <button id="btn-clear">Clear</button>
    </div>

    <pre id="results">Click a button to run a benchmark operation...</pre>

    <table>
        <thead><tr><th>ID</th><th>Label</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        // --- Data generation (same as js-framework-benchmark) ---
        const adjectives = ['pretty', 'large', 'big', 'small', 'tall', 'short', 'long', 'handsome', 'plain', 'quaint', 'clean', 'elegant', 'easy', 'angry', 'crazy', 'helpful', 'mushy', 'odd', 'unsightly', 'adorable', 'important', 'inexpensive', 'cheap', 'expensive', 'fancy'];
        const colours = ['red', 'yellow', 'blue', 'green', 'pink', 'brown', 'purple', 'brown', 'white', 'black', 'orange'];
        const nouns = ['table', 'chair', 'house', 'bbq', 'desk', 'car', 'pony', 'cookie', 'sandwich', 'burger', 'pizza', 'mouse', 'keyboard'];

        let nextId = 1;
        function buildData(count) {
            const data = [];
            for (let i = 0; i < count; i++) {
                data.push({
                    id: nextId++,
                    label: `${adjectives[Math.floor(Math.random() * adjectives.length)]} ${colours[Math.floor(Math.random() * colours.length)]} ${nouns[Math.floor(Math.random() * nouns.length)]}`
                });
            }
            return data;
        }

        // --- State ---
        let data = [];
        const tbody = document.getElementById('tbody');
        const resultsEl = document.getElementById('results');
        let timings = [];

        // --- Vanilla render (keyed by data-id) ---
        function render() {
            const existingRows = new Map();
            for (const row of tbody.children) {
                existingRows.set(parseInt(row.dataset.id), row);
            }

            const fragment = document.createDocumentFragment();
            const newRows = [];

            for (const item of data) {
                let row = existingRows.get(item.id);
                if (row) {
                    // Update existing
                    row.cells[1].textContent = item.label;
                    existingRows.delete(item.id);
                } else {
                    // Create new
                    row = document.createElement('tr');
                    row.dataset.id = item.id;
                    const td1 = document.createElement('td');
                    td1.textContent = item.id;
                    const td2 = document.createElement('td');
                    td2.textContent = item.label;
                    const td3 = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.textContent = '×';
                    btn.className = 'remove';
                    td3.appendChild(btn);
                    row.appendChild(td1);
                    row.appendChild(td2);
                    row.appendChild(td3);
                }
                newRows.push(row);
            }

            // Remove old rows
            for (const row of existingRows.values()) {
                row.remove();
            }

            // Rebuild order — append all in correct order
            // (detach from DOM first if needed, then append in order)
            tbody.textContent = '';
            for (const row of newRows) {
                fragment.appendChild(row);
            }
            tbody.appendChild(fragment);
        }

        // --- Benchmark helper ---
        function benchmark(name, fn) {
            const start = performance.now();
            fn();
            render();
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const elapsed = performance.now() - start;
                    timings.push({ name, elapsed, rows: data.length });
                    resultsEl.textContent = timings.map(t =>
                        `${t.name.padEnd(25)} ${t.elapsed.toFixed(1).padStart(8)}ms  (${t.rows} rows)`
                    ).join('\n');
                }, 0);
            });
        }

        // --- Operations ---
        document.getElementById('btn-create').addEventListener('click', () => {
            benchmark('Create 1,000', () => { data = buildData(1000); });
        });

        document.getElementById('btn-create10k').addEventListener('click', () => {
            benchmark('Create 10,000', () => { data = buildData(10000); });
        });

        document.getElementById('btn-append').addEventListener('click', () => {
            benchmark('Append 1,000', () => { data = data.concat(buildData(1000)); });
        });

        document.getElementById('btn-update').addEventListener('click', () => {
            benchmark('Update every 10th', () => {
                for (let i = 0; i < data.length; i += 10) {
                    data[i] = { ...data[i], label: data[i].label + ' !!!' };
                }
            });
        });

        document.getElementById('btn-swap').addEventListener('click', () => {
            benchmark('Swap rows 1↔998', () => {
                if (data.length > 998) {
                    const tmp = data[1];
                    data[1] = data[998];
                    data[998] = tmp;
                }
            });
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            benchmark('Clear', () => { data = []; });
        });
    </script>
</body>
</html>
