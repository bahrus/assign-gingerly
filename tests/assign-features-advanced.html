<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignFeatures - Advanced Features Tests</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-results { display: none; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignFeatures - Advanced Features Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    
    <!-- This element signals test completion to Playwright -->
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0" style="display:none;"></div>

    <script type="module">
        import assignGingerly from '../assignGingerly.js';
        import { captureFeatureInitVals } from '../assignFeatures.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                const result = fn();
                if (result && typeof result.then === 'function') {
                    // Async test — store promise
                    return result.then(() => {
                        passed++;
                        results.push({ name, status: 'pass' });
                    }).catch(error => {
                        failed++;
                        results.push({ name, status: 'fail', error: error.message });
                    });
                }
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
            return Promise.resolve();
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toBeUndefined() {
                    if (actual !== undefined) {
                        throw new Error(`Expected undefined but got ${JSON.stringify(actual)}`);
                    }
                },
                toBeInstanceOf(cls) {
                    if (!(actual instanceof cls)) {
                        throw new Error(`Expected instance of ${cls.name} but got ${actual?.constructor?.name}`);
                    }
                },
                toBeTruthy() {
                    if (!actual) {
                        throw new Error(`Expected truthy but got ${actual}`);
                    }
                },
                toThrow(expectedMsg) {
                    let threw = false;
                    let errorMsg = '';
                    try {
                        actual();
                    } catch (e) {
                        threw = true;
                        errorMsg = e.message;
                    }
                    if (!threw) {
                        throw new Error(`Expected function to throw but it did not`);
                    }
                    if (expectedMsg && !errorMsg.includes(expectedMsg)) {
                        throw new Error(`Expected error containing "${expectedMsg}" but got "${errorMsg}"`);
                    }
                }
            };
        }

        // Run all tests (including async) then display results
        async function runTests() {

        // ============================================================
        // ctx tests — FeatureSpawnContext is passed correctly
        // ============================================================

        await test('ctx: key is passed correctly', () => {
            let receivedCtx = null;
            class Impl { constructor(host, ctx) { receivedCtx = ctx; } }
            class TestEl extends HTMLElement {
                static supportedFeatures = { myFeature: { fallbackSpawn: Impl } }
            }
            customElements.assignFeatures(TestEl, { myFeature: { spawn: Impl } });
            customElements.define('test-adv-ctx-key', TestEl);
            const el = document.createElement('test-adv-ctx-key');
            el.myFeature;
            expect(receivedCtx.key).toBe('myFeature');
        });

        await test('ctx: optIn references supportedFeatures entry', () => {
            let receivedCtx = null;
            class Impl { constructor(host, ctx) { receivedCtx = ctx; } }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: Impl, validateShape: (i) => true }
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-ctx-optin', TestEl);
            const el = document.createElement('test-adv-ctx-optin');
            el.feat;
            expect(receivedCtx.optIn).toBe(TestEl.supportedFeatures.feat);
        });

        await test('ctx: injection references the FeatureConfig', () => {
            let receivedCtx = null;
            class Impl { constructor(host, ctx) { receivedCtx = ctx; } }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
            }
            const featureConfig = { spawn: Impl, customData: { version: 2 } };
            customElements.assignFeatures(TestEl, { feat: featureConfig });
            customElements.define('test-adv-ctx-injection', TestEl);
            const el = document.createElement('test-adv-ctx-injection');
            el.feat;
            expect(receivedCtx.injection).toBe(featureConfig);
            expect(receivedCtx.injection.customData.version).toBe(2);
        });

        await test('ctx: featuresRegistry is present', () => {
            let receivedCtx = null;
            class Impl { constructor(host, ctx) { receivedCtx = ctx; } }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-ctx-registry', TestEl);
            const el = document.createElement('test-adv-ctx-registry');
            el.feat;
            expect(typeof receivedCtx.featuresRegistry).toBe('object');
            expect(typeof receivedCtx.featuresRegistry.has).toBe('function');
        });

        // ============================================================
        // sharedContext tests
        // ============================================================

        await test('sharedContext: getSharedContext provides ctx.shared', () => {
            let receivedShared = null;
            class Impl { constructor(host, ctx) { receivedShared = ctx.shared; } }
            class TestEl extends HTMLElement {
                #secret = 'hidden-value';
                static supportedFeatures = {
                    feat: {
                        fallbackSpawn: Impl,
                        getSharedContext(instance) {
                            return { secret: instance.#secret };
                        }
                    }
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-shared', TestEl);
            const el = document.createElement('test-adv-shared');
            el.feat;
            expect(receivedShared.secret).toBe('hidden-value');
        });

        await test('sharedContext: ctx.shared is undefined when getSharedContext not defined', () => {
            let receivedCtx = null;
            class Impl { constructor(host, ctx) { receivedCtx = ctx; } }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-no-shared', TestEl);
            const el = document.createElement('test-adv-no-shared');
            el.feat;
            expect(receivedCtx.shared).toBeUndefined();
        });

        await test('sharedContext: different features get different shared contexts', () => {
            let sharedA = null, sharedB = null;
            class ImplA { constructor(host, ctx) { sharedA = ctx.shared; } }
            class ImplB { constructor(host, ctx) { sharedB = ctx.shared; } }
            class TestEl extends HTMLElement {
                #internals = 'internals-value';
                #state = { count: 0 };
                static supportedFeatures = {
                    featA: {
                        fallbackSpawn: ImplA,
                        getSharedContext(instance) {
                            return { internals: instance.#internals };
                        }
                    },
                    featB: {
                        fallbackSpawn: ImplB,
                        getSharedContext(instance) {
                            return { state: instance.#state };
                        }
                    }
                }
            }
            customElements.assignFeatures(TestEl, {
                featA: { spawn: ImplA },
                featB: { spawn: ImplB }
            });
            customElements.define('test-adv-diff-shared', TestEl);
            const el = document.createElement('test-adv-diff-shared');
            el.featA;
            el.featB;
            expect(sharedA.internals).toBe('internals-value');
            expect(sharedB.state.count).toBe(0);
            expect(sharedA.state).toBeUndefined();
            expect(sharedB.internals).toBeUndefined();
        });

        // ============================================================
        // customData tests
        // ============================================================

        await test('customData: accessible via ctx.injection.customData', () => {
            let receivedCustomData = null;
            class Impl {
                constructor(host, ctx) { receivedCustomData = ctx.injection.customData; }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: Impl, customData: { apiUrl: 'https://example.com', retries: 3 } }
            });
            customElements.define('test-adv-customdata', TestEl);
            const el = document.createElement('test-adv-customdata');
            el.feat;
            expect(receivedCustomData.apiUrl).toBe('https://example.com');
            expect(receivedCustomData.retries).toBe(3);
        });

        // ============================================================
        // Async spawn tests
        // ============================================================

        await test('async: placeholder object returned immediately', () => {
            class AsyncImpl {
                constructor(host, ctx, initVals) {
                    if (initVals) Object.assign(this, initVals);
                    this.isReal = true;
                }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: AsyncImpl } }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => new Promise(resolve => setTimeout(() => resolve(AsyncImpl), 50)) }
            });
            customElements.define('test-adv-async-placeholder', TestEl);
            const el = document.createElement('test-adv-async-placeholder');
            const placeholder = el.feat;
            // Placeholder is a plain object, not an instance of AsyncImpl
            expect(placeholder.isReal).toBeUndefined();
            expect(typeof placeholder).toBe('object');
        });

        await test('async: placeholder accumulates properties via assignGingerly', () => {
            class AsyncImpl {
                constructor(host, ctx, initVals) {
                    if (initVals) Object.assign(this, initVals);
                    this.isReal = true;
                }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: AsyncImpl } }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => new Promise(resolve => setTimeout(() => resolve(AsyncImpl), 50)) }
            });
            customElements.define('test-adv-async-accumulate', TestEl);
            const el = document.createElement('test-adv-async-accumulate');
            assignGingerly(el, { feat: { someProp: 'hello' } });
            const placeholder = el.feat;
            expect(placeholder.someProp).toBe('hello');
        });

        await test('async: real instance replaces placeholder after resolution', async () => {
            class AsyncImpl {
                constructor(host, ctx, initVals) {
                    if (initVals) Object.assign(this, initVals);
                    this.isReal = true;
                }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: AsyncImpl } }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => new Promise(resolve => setTimeout(() => resolve(AsyncImpl), 50)) }
            });
            customElements.define('test-adv-async-resolve', TestEl);
            const el = document.createElement('test-adv-async-resolve');
            assignGingerly(el, { feat: { someProp: 'world' } });

            // Wait for async resolution
            await new Promise(resolve => setTimeout(resolve, 100));

            const instance = el.feat;
            expect(instance.isReal).toBe(true);
            expect(instance.someProp).toBe('world');
        });

        await test('async: error state throws on subsequent access', async () => {
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: class {} } }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => Promise.reject(new Error('network failure')) }
            });
            customElements.define('test-adv-async-error', TestEl);
            const el = document.createElement('test-adv-async-error');
            el.feat; // triggers async, returns placeholder

            // Wait for rejection to be processed
            await new Promise(resolve => setTimeout(resolve, 50));

            expect(() => el.feat).toThrow('async spawn for "feat" failed');
        });

        // ============================================================
        // whenFeatureReady tests
        // ============================================================

        await test('whenFeatureReady: method is installed when lifecycleKeys is true', () => {
            class Impl { constructor(host) {} }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: Impl }
                }
                static featuresConfig = { lifecycleKeys: true
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-lifecycle-install', TestEl);
            const el = document.createElement('test-adv-lifecycle-install');
            expect(typeof el.whenFeatureReady).toBe('function');
        });

        await test('whenFeatureReady: custom method name via lifecycleKeys object', () => {
            class Impl { constructor(host) {} }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: Impl }
                }
                static featuresConfig = { lifecycleKeys: { whenFeatureReady: 'awaitFeature' } }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-lifecycle-custom', TestEl);
            const el = document.createElement('test-adv-lifecycle-custom');
            expect(typeof el.awaitFeature).toBe('function');
        });

        await test('whenFeatureReady: resolves immediately for sync features', async () => {
            class Impl {
                constructor(host) { this.ready = true; }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: Impl }
                }
                static featuresConfig = { lifecycleKeys: true
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Impl } });
            customElements.define('test-adv-lifecycle-sync', TestEl);
            const el = document.createElement('test-adv-lifecycle-sync');
            const instance = await el.whenFeatureReady('feat');
            expect(instance.ready).toBe(true);
        });

        await test('whenFeatureReady: resolves after async spawn completes', async () => {
            class AsyncImpl {
                constructor(host, ctx, initVals) {
                    this.resolved = true;
                    if (initVals) Object.assign(this, initVals);
                }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: AsyncImpl }
                }
                static featuresConfig = { lifecycleKeys: true }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => new Promise(resolve => setTimeout(() => resolve(AsyncImpl), 50)) }
            });
            customElements.define('test-adv-lifecycle-async', TestEl);
            const el = document.createElement('test-adv-lifecycle-async');

            const instance = await el.whenFeatureReady('feat');
            expect(instance.resolved).toBe(true);
            expect(instance instanceof AsyncImpl).toBe(true);
        });

        await test('whenFeatureReady: rejects when async spawn fails', async () => {
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: class {} }
                }
                static featuresConfig = { lifecycleKeys: true }
            }
            customElements.assignFeatures(TestEl, {
                feat: { spawn: () => Promise.reject(new Error('load failed')) }
            });
            customElements.define('test-adv-lifecycle-reject', TestEl);
            const el = document.createElement('test-adv-lifecycle-reject');

            let caught = false;
            try {
                await el.whenFeatureReady('feat');
            } catch (e) {
                caught = true;
                expect(e.message.includes('async spawn for "feat" failed')).toBe(true);
            }
            expect(caught).toBe(true);
        });

        // ============================================================
        // withAttrs tests
        // ============================================================

        await test('withAttrs: parses attributes into initVals', () => {
            let receivedInitVals = null;
            class Impl {
                constructor(host, ctx, initVals) { receivedInitVals = initVals; }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
            }
            customElements.assignFeatures(TestEl, {
                feat: {
                    spawn: Impl,
                    withAttrs: {
                        base: 'photo',
                        mode: '${base}-mode'
                    }
                }
            });
            customElements.define('test-adv-attrs-basic', TestEl);
            const el = document.createElement('test-adv-attrs-basic');
            el.setAttribute('photo-mode', 'portrait');
            document.body.appendChild(el);
            el.feat;
            expect(receivedInitVals.mode).toBe('portrait');
            el.remove();
        });

        await test('withAttrs: programmatic initVals override attributes', () => {
            let receivedInitVals = null;
            class Impl {
                constructor(host, ctx, initVals) {
                    receivedInitVals = initVals;
                    if (initVals) Object.assign(this, initVals);
                }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = { feat: { fallbackSpawn: Impl } }
                constructor() {
                    super();
                    captureFeatureInitVals(this);
                }
            }
            customElements.assignFeatures(TestEl, {
                feat: {
                    spawn: Impl,
                    withAttrs: {
                        base: 'cfg',
                        mode: '${base}-mode',
                        color: '${base}-color'
                    }
                }
            });

            // Create element in DOM before define
            const el = document.createElement('test-adv-attrs-override');
            el.setAttribute('cfg-mode', 'landscape');
            el.setAttribute('cfg-color', 'blue');
            document.body.appendChild(el);
            el.feat = { mode: 'portrait' }; // programmatic override for mode only

            customElements.define('test-adv-attrs-override', TestEl);

            el.feat;
            // mode should be 'portrait' (programmatic wins)
            // color should be 'blue' (from attribute, no programmatic override)
            expect(receivedInitVals.mode).toBe('portrait');
            expect(receivedInitVals.color).toBe('blue');
            el.remove();
        });

        // ============================================================
        // withAsyncMethods tests
        // ============================================================

        await test('withAsyncMethods: awaits async method then assigns property', async () => {
            class AsyncFeature {
                constructor(host) { this.value = 'initial'; }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: AsyncFeature }
                }
                static featuresConfig = { lifecycleKeys: true }
                async whenFeatureReady(key) {
                    // Simulate — just return the feature after a tick
                    await new Promise(r => setTimeout(r, 10));
                    return this[key];
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: AsyncFeature } });
            customElements.define('test-adv-asyncmethods-assign', TestEl);
            const el = document.createElement('test-adv-asyncmethods-assign');

            // Use withAsyncMethods to await whenFeatureReady then assign
            assignGingerly(el, {
                '?.whenFeatureReady?.feat?.value': 'updated'
            }, { withAsyncMethods: ['whenFeatureReady'] });

            // Wait for async chain to complete
            await new Promise(r => setTimeout(r, 50));

            expect(el.feat.value).toBe('updated');
        });

        await test('withAsyncMethods: works with sync methods in same path', async () => {
            class Feature {
                constructor(host) { this.items = { count: 0 }; }
            }
            class TestEl extends HTMLElement {
                static supportedFeatures = {
                    feat: { fallbackSpawn: Feature, lifecycleKeys: true }
                }
                async whenFeatureReady(key) {
                    return this[key];
                }
            }
            customElements.assignFeatures(TestEl, { feat: { spawn: Feature } });
            customElements.define('test-adv-asyncmethods-mixed', TestEl);
            const el = document.createElement('test-adv-asyncmethods-mixed');

            assignGingerly(el, {
                '?.whenFeatureReady?.feat?.items?.count': 42
            }, { withAsyncMethods: ['whenFeatureReady'] });

            await new Promise(r => setTimeout(r, 50));

            expect(el.feat.items.count).toBe(42);
        });

        // ============================================================
        // Display results
        // ============================================================

        } // end runTests

        runTests().then(() => {
            const total = passed + failed;
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            const completeEl = document.getElementById('test-complete');

            statusEl.innerHTML = `
                <span class="${failed === 0 ? 'pass' : 'fail'}">
                    ${passed}/${total} tests passed
                </span>
            `;

            results.forEach(result => {
                const div = document.createElement('div');
                div.className = `test-item ${result.status}`;
                div.innerHTML = `
                    <strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}
                    ${result.error ? `<div class="error">${result.error}</div>` : ''}
                `;
                resultsEl.appendChild(div);
            });

            // Signal completion to Playwright
            completeEl.setAttribute('data-passed', passed.toString());
            completeEl.setAttribute('data-failed', failed.toString());
            completeEl.setAttribute('data-total', total.toString());
            completeEl.style.display = 'block';

            console.log(`Tests complete: ${passed}/${total} passed`);
        });
    </script>
</body>
</html>
