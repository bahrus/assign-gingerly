<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>applyResidue Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>applyResidue tests</h1>
  <div id="results"></div>
  <div id="test-complete" style="display:none;" data-status="" data-passed="0" data-failed="0"></div>

  <script type="module">
    import { applyResidue, assignFromAsync, ItemscopeRegistry, RESIDUE_ATTRIBUTE } from '../index.js';

    const results = [];
    let passed = 0;
    let failed = 0;
    function assert(condition, message) {
      results.push(`<div class="${condition ? 'pass' : 'fail'}">${condition ? '✓' : '✗'} ${message}</div>`);
      condition ? passed++ : failed++;
      if (!condition) console.error('Failed:', message);
    }
    function assertEquals(actual, expected, message) {
      if (actual !== expected) console.error(`${message}\n  Expected: ${expected}\n  Actual:   ${actual}`);
      assert(actual === expected, message);
    }
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    const html = markup => {
      const div = document.createElement('div');
      div.innerHTML = markup.trim();
      document.body.append(div);
      return div;
    };

    async function runTests() {
      assertEquals(RESIDUE_ATTRIBUTE, 'data-residue', 'the shared attribute name');

      // Test 1: properties and events applied; marks removed once ready; host = options.from
      {
        const host = html(`
          <form>
            <input type="number" data-residue="e1">
            <button type="button" data-residue="e2">Save</button>
            <span data-residue="unknown">no entry</span>
            <p>unmarked</p>
          </form>`);
        const calls = [];
        const vm = { save() { calls.push('save'); } };
        await applyResidue(host, {
          e1: { valueAsNumber: 3 },
          e2: { ' +=': { on: 'click', call: 'save' } },
        }, { from: vm });
        assertEquals(host.querySelector('input').valueAsNumber, 3, 'a property is set');
        host.querySelector('button').click();
        assertEquals(calls.join(), 'save', 'an event is bound, with options.from as its host (already attached when the promise resolves)');
        assertEquals(host.querySelectorAll(`[${RESIDUE_ATTRIBUTE}]`).length, 0, 'every mark is removed, including one with no entry');
        host.remove();
      }

      // Test 2: a manager (itemscope name) attaches first, and is the host inside its element
      {
        const log = [];
        class CardManager {
          constructor(el, initVals, { rebind }) { Object.assign(this, initVals); this.rebindType = typeof rebind; }
          bump() { log.push(`bump ${this.name}`); }
        }
        const itemscopeRegistry = new ItemscopeRegistry({ 'card-manager': CardManager });
        const host = html(`
          <section itemscope="card-manager" class="card" data-residue="e1">
            <h3>Card</h3>
            <button type="button" data-residue="e2">Bump</button>
          </section>
          <button type="button" class="outside" data-residue="e3">Outside</button>`);
        const vm = { bump() { log.push('vm bump'); } };
        await applyResidue(host, {
          e1: { ish: { name: 'Falcon' } },
          e2: { ' +=': { on: 'click', call: 'bump' } },
          e3: { ' +=': { on: 'click', call: 'bump' } },
        }, { from: vm, registry: { itemscopeRegistry } });
        const section = host.querySelector('section');
        assert(section.ish instanceof CardManager && section.ish.name === 'Falcon', 'manager: attached with its value (by its itemscope name, through the registry option)');
        assertEquals(section.ish.rebindType, 'function', 'manager: gets ctx.rebind');
        assertEquals(section.className, 'card', 'manager: class untouched');
        host.querySelector('section button').click();
        host.querySelector('.outside').click();
        assertEquals(log.join(' / '), 'bump Falcon / vm bump', "host: the manager inside its element, options.from outside");
        assertEquals(host.querySelectorAll('[data-residue]').length, 0, 'every mark is removed');
        host.remove();
      }

      // Test 3: marks stay while their element isn't ready (a manager registered later), and go per element
      {
        class Late { constructor(el, v) { Object.assign(this, v); } }
        const itemscopeRegistry = new ItemscopeRegistry();
        const host = html(`
          <div itemscope="late-manager" data-residue="e1"><span>late</span></div>
          <input type="number" data-residue="e2">`);
        const done = applyResidue(host, { e1: { ish: { n: 1 } }, e2: { valueAsNumber: 5 } }, { registry: { itemscopeRegistry } });
        await delay(30);
        assert(host.querySelector('div').hasAttribute('data-residue'), 'pending: the managed element stays marked until its manager exists');
        assert(!host.querySelector('input').hasAttribute('data-residue'), 'per element: a ready element is unmarked meanwhile');
        itemscopeRegistry.define('late-manager', Late);
        await done;
        assert(!host.querySelector('div').hasAttribute('data-residue') && host.querySelector('div').ish?.n === 1, 'pending: unmarked once the manager is attached');
        host.remove();
      }

      // Test 4: the container itself can be marked; nothing marked → nothing to do
      {
        const container = document.createElement('input');
        container.type = 'number';
        container.setAttribute('data-residue', 'e1');
        await applyResidue(container, { e1: { valueAsNumber: 7 } });
        assert(container.valueAsNumber === 7 && !container.hasAttribute('data-residue'), 'the container itself, when marked');
        await applyResidue(document.createElement('div'), null);
        assert(true, 'no marks and no residue: resolves');
      }

      // Test 5: builtIns.scope removes the mark after its first bind
      {
        const host = html(`<div itemprop="crew" data-residue="e1"><span itemprop="name"></span></div>`);
        const target = host.firstElementChild;
        await assignFromAsync(target, { '?. =>': { do: 'builtIns.scope', bind: { infer: { byItemprop: true } } } }, { from: { crew: { name: 'Avery' } } });
        assert(target.querySelector('span').textContent === 'Avery' && !target.hasAttribute('data-residue'), 'builtIns.scope: bound, then unmarked');
        host.remove();
      }

      document.getElementById('results').innerHTML = results.join('') + `<h2>Summary: ${passed} passed, ${failed} failed</h2>`;
      const complete = document.getElementById('test-complete');
      complete.dataset.passed = passed;
      complete.dataset.failed = failed;
      complete.dataset.status = failed === 0 ? 'success' : 'failure';
    }

    runTests().catch(error => {
      console.error(error);
      assert(false, `unexpected error: ${error.message}`);
      document.getElementById('results').innerHTML = results.join('');
      const complete = document.getElementById('test-complete');
      complete.dataset.passed = passed;
      complete.dataset.failed = failed;
      complete.dataset.status = 'failure';
    });
  </script>
</body>
</html>
