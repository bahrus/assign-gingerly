<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tree`…` Tagged Template Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>tree`…` tagged template tests</h1>
  <div id="results"></div>
  <div id="test-complete" style="display:none;" data-status="" data-passed="0" data-failed="0"></div>

  <script type="module">
    import { assignFrom, whenSettled } from '../index.js';
    import { tree, each, TreeTemplateError, analyzeTree, TreeUnknown } from '../DX/tree.js';
    import { paths, md } from '../DX/paths.js';

    const results = [];
    let passed = 0;
    let failed = 0;
    function assert(condition, message) {
      results.push(`<div class="${condition ? 'pass' : 'fail'}">${condition ? '✓' : '✗'} ${message}</div>`);
      condition ? passed++ : failed++;
      if (!condition) console.error('Failed:', message);
    }
    function assertEquals(actual, expected, message) {
      if (actual !== expected) console.error(`${message}\n  Expected: ${expected}\n  Actual:   ${actual}`);
      assert(actual === expected, message);
    }
    const json = value => JSON.stringify(value);
    function throws(fn, pattern, message) {
      let error;
      try { fn(); } catch (e) { error = e; }
      assert(error && pattern.test(error.message), `${message}${error ? '' : ' (did not throw)'}`);
    }

    async function render(map, vm, extra = {}) {
      const host = document.createElement('div');
      assignFrom(host, { '?. =>': { do: 'builtIns.tree', map, ...extra } }, { from: vm });
      await whenSettled(host);
      return host;
    }

    const p = paths();

    async function runTests() {
      // Test 1: the design example → the tree notation written by hand
      {
        const card = () => tree`
          <article class="card" aria-label=${p.label}>
            <h3 class="title">${p.name}</h3>
            <p>Launched ${p.date} by ${p.rocket}</p>
            <ul ${each(p.crew, { key: '?.id' })}>
              <li>${'?.name'}</li>
            </ul>
            <button @click=${{ call: 'launch' }}>Launch</button>
          </article>`;
        assertEquals(json(card()), json(['article', { 'class :=': 'card', 'aria-label :=': '?.label' }, [
          ['h3', { 'class :=': 'title', textContent: '?.name' }],
          ['p', { '?. =&': { microJoin: ['Launched ', '?.date', ' by ', '?.rocket'] } }],
          ['ul', {}, { each: ['li', { textContent: '?.name' }], of: '?.crew', key: '?.id' }],
          ['button', { ' +=': { on: 'click', call: 'launch' }, textContent: 'Launch' }],
        ]]), 'the design example produces the expected tree notation');
        assert(card() === card(), 'cached per call site: the same template and values give the same spec object');
      }

      // Test 2: renders through builtIns.tree exactly like hand-written notation; compile bakes its literal attributes
      {
        const map = { launch: tree`
          <article class="card">
            <h3 class="title">${'?.name'}</h3>
            <dl><dt>Height</dt><dd>${'?.height'}</dd></dl>
            <ol ${each('?.crew', { key: '?.id', empty: tree`<li>None</li>` })}><li class="crew">${'?.name'}</li></ol>
          </article>` };
        const byHand = { launch: ['article', { 'class :=': 'card' }, [
          ['h3', { 'class :=': 'title', textContent: '?.name' }],
          ['dl', {}, [['dt', { textContent: 'Height' }], ['dd', { textContent: '?.height' }]]],
          ['ol', {}, { each: ['li', { 'class :=': 'crew', textContent: '?.name' }], of: '?.crew', key: '?.id', empty: ['li', { textContent: 'None' }] }],
        ]] };
        const vm = { launch: { name: 'Demo 7', height: '70 m', crew: [{ id: 1, name: 'Bob' }, { id: 2, name: 'Doug' }] } };
        const html = (await render(map, vm)).innerHTML;
        assertEquals(html, (await render(byHand, vm)).innerHTML, 'renders the same DOM as the hand-written notation');
        assert(html.includes('<li class="crew">Bob</li>'), 'repeat items rendered');
        const empty = await render(map, { launch: { name: 'x', height: 'y', crew: [] } });
        assertEquals(empty.querySelector('ol').textContent, 'None', 'each(…, { empty }) renders the empty spec');
        const compiled = await render(map, vm, { compile: true });
        assertEquals(compiled.innerHTML, html, 'compile: same output');
      }

      // Test 3: attributes, properties, booleans, entities, void and self-closing elements, ish headers
      {
        class XThing {}
        assertEquals(json(tree`<input .value=${'?.v'} disabled type="text" title="a &amp; b &lt;c&gt; &#65;&#x42;">`),
          json(['input', { value: '?.v', 'disabled :=': true, 'type :=': 'text', 'title :=': 'a & b <c> AB' }]),
          '.prop → property; bare name → true; literal attributes; entities decoded; void element');
        assertEquals(json(tree`<div><x-icon name="star" /><span>after</span></div>`),
          json(['div', {}, [['x-icon', { 'name :=': 'star' }], ['span', { textContent: 'after' }]]]),
          'self-closing elements');
        const spec = tree`<section ish=${XThing}><p>${'?.x'}</p></section>`;
        assert(spec[0].tag === 'section' && spec[0].ish === XThing, 'ish=${Manager} → { tag, ish } header');
      }

      // Test 4: events
      {
        assertEquals(json(tree`<button @click=${'save'} @focus=${{ call: 'track' }}>Go</button>`),
          json(['button', { ' +=': { on: 'click', call: 'save' }, '?. +=': { on: 'focus', call: 'track' }, textContent: 'Go' }]),
          '@event=${"method"} and @event=${config}; two bindings use the two self-binding keys');
        throws(() => tree`<b @a=${'x'} @b=${'y'} @c=${'z'}></b>`, /at most two @event/, 'a third @event binding is a clear error');
      }

      // Test 5: text handling — whitespace, leading text with children, microJoin, md segments, paths proxies
      {
        assertEquals(json(tree`
          <ul>
            <li>one</li>
          </ul>`), json(['ul', {}, [['li', { textContent: 'one' }]]]), 'indentation whitespace dropped');
        assertEquals(json(tree`<p>Total: <b>${'?.n'}</b></p>`),
          json(['p', { textContent: 'Total: ' }, [['b', { textContent: '?.n' }]]]), 'leading literal text before children → textContent');
        assertEquals(json(tree`<p>${p.first} ${p.last}</p>`),
          json(['p', { '?. =&': { microJoin: ['?.first', ' ', '?.last'] } }]), 'paths proxies + mixed text → microJoin');
        assertEquals(json(tree`<p>${md`${p.first} ${p.last}`[0]}</p>`),
          json(['p', { '?. =&': { microJoin: [{ prop: 'first', val: '?.first' }] } }]), 'a { prop, val } segment as the only content → microJoin');
        const span = await render({ person: tree`<p>${p.last}, ${p.first}</p>` }, { person: { last: 'Targaryen', first: 'Helaena' } });
        assertEquals(span.querySelector('p').innerHTML, '<span>Targaryen</span>, <span>Helaena</span>', 'mixed text renders through microJoin');
      }

      // Test 6: composition and caching with changing values
      {
        const item = tree`<li>${'?.name'}</li>`;
        const list = tree`<ul ${each('?.items')}>${item}</ul>`;
        const host = await render({ list }, { list: { items: [{ name: 'a' }, { name: 'b' }] } });
        assertEquals(host.querySelectorAll('li').length, 2, '${tree`…`} composes as a child (here, the repeat item)');
        const make = path => tree`<b>${path}</b>`;
        assert(make('?.a') === make('?.a') && make('?.a') !== make('?.b'), 'cache: same values → same object; different values → new object');
      }

      // Test 8: pattern spread (keys markup can't express) and "nothing" content
      {
        assertEquals(json(tree`<span class="badge" ${{ '_ ?=': ['?.ok', 'Yes', 'No'], title: p.tip }}></span>`),
          json(['span', { 'class :=': 'badge', '_ ?=': ['?.ok', 'Yes', 'No'], title: '?.tip' }]),
          'a plain object in attribute position is merged into the pattern (proxies converted)');
        const row = action => tree`<div><span>Label</span>${action}<span>${'?.v'}</span></div>`;
        assertEquals(json(row(null)), json(['div', {}, [['span', { textContent: 'Label' }], ['span', { textContent: '?.v' }]]]),
          'null content renders nothing (an optional child left out)');
        assertEquals(json(row(tree`<button>Go</button>`)[2].map(child => child[0])), json(['span', 'button', 'span']),
          'the same template with a child in that position');
        throws(() => tree`<b ${42}></b>`, /each\(…\) or a pattern object/, 'other values in attribute position are an error');
      }

      // Test 9: errors carry precise locations (for editors): part/offset exact (raw offsets: each \n escape in these templates is 2 source characters), line/column as displayed
      {
        const caught = fn => { try { fn(); } catch (e) { return e; } };
        const where = e => e && `${e.name}|${e.part}:${e.offset}|${e.line}:${e.column}`;

        const attr = caught(() => tree`<div>\n  <p class="a ${'?.x'}"></p>\n</div>`);
        assert(attr instanceof TreeTemplateError, 'errors are TreeTemplateErrors');
        assertEquals(where(attr), 'TreeTemplateError|0:12|2:6', 'mixed attribute: points at the attribute (part 0, raw offset 12; line 2, column 6)');
        assert(/\(line 2, column 6\)\n  <p class="a \$\{…\}"><\/p>\n     \^/.test(attr.message), 'message has the location and a code frame with a caret');

        const trailing = caught(() => tree`<p>${'?.a'}<b>x</b> trailing</p>`);
        assertEquals(where(trailing), 'TreeTemplateError|1:9|1:17', 'text after a child: points at the text, in the second static string (part 1, offset 9)');

        const mismatch = caught(() => tree`<ul>\n<li></ul>`);
        assertEquals(where(mismatch), 'TreeTemplateError|0:10|2:5', 'mismatched closing tag: points at </ul>');

        const roots = caught(() => tree`<p>a</p>\n<p>b</p>`);
        assertEquals(where(roots), 'TreeTemplateError|0:10|2:1', 'two roots: points at the second');
      }

      // Test 10: error offsets are raw (source) offsets, so escapes before the error don't shift them
      {
        const caught = fn => { try { fn(); } catch (e) { return e; } };
        const escaped = caught(() => tree`<p>\`x\`</b>`);
        assertEquals(`${escaped.part}:${escaped.offset}`, '0:8', 'raw offset: two \\` escapes before </b> (cooked offset 6)');
        const emoji = caught(() => tree`<p>\u{1F332}</b>`);
        assertEquals(`${emoji.part}:${emoji.offset}`, '0:12', 'raw offset: a \\u{…} escape (2 cooked units, 9 raw characters)');
        const noRaw = analyzeTree(['<p>`x`</b>'], []).errors[0];
        assertEquals(`${noRaw.part}:${noRaw.offset}`, '0:6', 'without strings.raw, the offset is in the cooked string');
      }

      // Test 11: analyzeTree, with known values, matches the tag
      {
        const analyze = (strings, ...values) => analyzeTree(strings, values);
        const result = analyze`<article class="card" aria-label=${p.label}>
            <h3 class="title">${p.name}</h3>
            <ul ${each(p.crew, { key: '?.id' })}><li>${'?.name'}</li></ul>
            <button @click=${{ call: 'launch' }}>Launch</button>
          </article>`;
        assertEquals(json(result.errors), '[]', 'analyzeTree: no errors');
        assertEquals(json(result.spec), json(['article', { 'class :=': 'card', 'aria-label :=': '?.label' }, [
          ['h3', { 'class :=': 'title', textContent: '?.name' }],
          ['ul', {}, { each: ['li', { textContent: '?.name' }], of: '?.crew', key: '?.id' }],
          ['button', { ' +=': { on: 'click', call: 'launch' }, textContent: 'Launch' }],
        ]]), 'analyzeTree: the same notation as the tag');
        const nested = analyze`<ul ${each('?.items')}>${analyze`<li>${'?.n'}</li>`.spec}</ul>`;
        assertEquals(json(nested.spec), json(['ul', {}, { each: ['li', { textContent: '?.n' }], of: '?.items' }]),
          'analyzeTree: a nested analyzeTree spec composes like a nested tree`…`');

        const errors = analyze`<p>a</p><p>b</p>`;
        assert(errors.errors[0] instanceof TreeTemplateError && /exactly one root/.test(errors.errors[0].message) && errors.spec === undefined,
          'analyzeTree: errors are returned, not thrown');
        const third = analyze`<b @a=${'x'} @b=${'y'} @c=${'z'}></b>`;
        assert(third.errors.length === 1 && third.elements[0]?.tag === 'b', 'analyzeTree: elements are still returned when only the conversion fails');
      }

      // Test 12: analyzeTree with statically unknown values (TreeUnknown) is lenient
      {
        const analyze = (strings, ...values) => analyzeTree(strings, values);
        const U = new TreeUnknown('x');
        const ok = (result, message) => {
          if (result.errors.length) console.error(message, result.errors[0].message);
          assert(result.errors.length === 0, message);
        };
        ok(analyze`<ul ${U}><li>${'?.n'}</li></ul>`, 'an unknown in attribute position (each(…) or a pattern object) is accepted');
        ok(analyze`<ul ${each('?.items')}>${U}</ul>`, 'an unknown as the repeat item is a child');
        const row = analyze`<div><span>a</span>${U}<span>b</span></div>`;
        ok(row, 'an unknown between child elements is a child');
        assertEquals(row.spec[2].length, 3, '…placed among the children');
        const text = analyze`<p>${U}</p>`;
        assertEquals(json(text.spec), json(['p', { textContent: '‹x›' }]), 'an unknown as the only content is text, shown as ‹x›');
        ok(analyze`<button @click=${U}>Go</button>`, 'an unknown @event value is accepted');
        assert(analyze`<p class="a ${U}"></p>`.errors.length === 1, 'real errors are still reported around unknowns');
      }

      // Test 13: analyzeTree describes the elements, with locations
      {
        const analyze = (strings, ...values) => analyzeTree(strings, values);
        const { elements: [div] } = analyze`<div class="a" .value=${new TreeUnknown()} @click=${'go'} ${{ title: 'x' }}>
  <span hidden></span></div>`;
        assertEquals(json(div.attributes.map(({ name, hole, location: { part, offset } }) => [name, hole, part, offset])),
          json([['class', null, 0, 5], ['.value', 0, 0, 15], ['@click', 1, 1, 1], ]), 'attributes: names, hole indexes, locations');
        assertEquals(json(div.directives.map(({ hole, location: { part, offset } }) => [hole, part, offset])), json([[2, 2, 1]]), 'directives');
        assertEquals(json([div.children[0].tag, div.children[0].location.part, div.children[0].location.offset, div.children[0].attributes[0].name]),
          json(['span', 3, 4, 'hidden']), 'child elements, with locations');
      }

      // Test 7: clear errors
      {
        throws(() => tree`<p>a</p><p>b</p>`, /exactly one root element/, 'two roots');
        throws(() => tree`<p><b>x</b> trailing</p>`, /text after a child element/, 'text after a child element');
        throws(() => tree`<p class="a ${'?.b'}"></p>`, /mixes text and/, 'mixed attribute value');
        throws(() => tree`<p><b>x</p></b>`, /doesn't match/, 'mismatched closing tag');
        throws(() => tree`<ul ${each('?.x')}><li></li><li></li></ul>`, /exactly one child element/, 'each(…) with two children');
      }

      // Test 14: itemscope on the element gives the values in its text props (microJoin { prop, val })
      {
        assertEquals(json(tree`<p itemscope>Launched ${p.date} by ${p.rocket}</p>`),
          json(['p', { 'itemscope :=': true, '?. =&': { microJoin: ['Launched ', { prop: 'date', val: '?.date' }, ' by ', { prop: 'rocket', val: '?.rocket' }] } }]),
          'itemscope: paths() values become { prop, val }, named after the path');
        assertEquals(json(tree`<p itemscope>${'?.rocket?.name'} from ${'$parent?.site'}${'!!?.reused'}</p>`[1]['?. =&'].microJoin),
          json([{ prop: 'name', val: '?.rocket?.name' }, ' from ', { prop: 'site', val: '$parent?.site' }, { prop: 'reused', val: '!!?.reused' }]),
          "itemscope: '?.' strings too; the last segment names it, for $parent paths and negations as well");
        assertEquals(json(tree`<b itemscope>${p.name}</b>`),
          json(['b', { 'itemscope :=': true, '?. =&': { microJoin: [{ prop: 'name', val: '?.name' }] } }]),
          'itemscope: a single value is a one-segment microJoin (textContent carries no prop)');
        assertEquals(json(tree`<p itemscope>On ${{ prop: 'launched', val: p.date, text: '?.date?.longUtc' }} (${'note'}) ${'?.'}</p>`[1]['?. =&'].microJoin),
          json(['On ', { prop: 'launched', val: '?.date', text: '?.date?.longUtc' }, ' (', 'note', ') ', '?.']),
          'itemscope: explicit { prop, … } objects win; literal strings and a bare ?. stay as they are');
        assertEquals(json(tree`<p itemscope>Static text</p>`), json(['p', { 'itemscope :=': true, textContent: 'Static text' }]),
          'itemscope: literal-only text stays textContent');
        assertEquals(json(tree`<p>Launched ${p.date}</p>`), json(['p', { '?. =&': { microJoin: ['Launched ', '?.date'] } }]),
          'without itemscope: unchanged (no props)');
        const host = await render({ launch: tree`<p itemscope>Launched ${p.date} by ${p.rocket}</p>` }, { launch: { date: 'Tuesday', rocket: 'Falcon 9' } });
        assertEquals(host.querySelector('p').outerHTML, '<p itemscope="">Launched <span itemprop="date">Tuesday</span> by <span itemprop="rocket">Falcon 9</span></p>',
          'itemscope: renders itemprop elements');
      }

      document.getElementById('results').innerHTML = results.join('') + `<h2>Summary: ${passed} passed, ${failed} failed</h2>`;
      const done = document.getElementById('test-complete');
      done.setAttribute('data-passed', passed);
      done.setAttribute('data-failed', failed);
      done.setAttribute('data-status', failed === 0 ? 'success' : 'failure');
    }

    runTests().catch(e => {
      console.error('Test error:', e);
      document.getElementById('results').innerHTML += `<div class="fail">Test suite error: ${e.message}</div>`;
      document.getElementById('test-complete').setAttribute('data-status', 'error');
    });
  </script>
</body>
</html>
