<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+= Event Binding Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    #results { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>+= Event Binding Tests</h1>
  <div id="results"></div>
  <div id="test-complete" style="display:none;" data-status="" data-passed="0" data-failed="0"></div>

  <script type="module">
    import { assignFrom, assignFromAsync, assignGingerly } from '../index.js';

    const results = [];
    let passed = 0;
    let failed = 0;

    function assert(condition, message) {
      if (condition) {
        results.push(`<div class="pass">✓ ${message}</div>`);
        passed++;
      } else {
        results.push(`<div class="fail">✗ ${message}</div>`);
        failed++;
        console.error('Failed:', message);
      }
    }

    function assertEquals(actual, expected, message) {
      if (actual !== expected) {
        console.error(`Expected: ${expected}, Actual: ${actual}`);
      }
      assert(actual === expected, message);
    }

    // Listeners attach after a dynamic import (fire-and-forget), so give them a moment
    const settle = () => new Promise(r => setTimeout(r, 30));

    function makeRoot() {
      const root = document.createElement('div');
      root.innerHTML = '<button data-diff="5">+5</button>';
      return root;
    }

    async function runTests() {
      // Warm the on-demand modules so the short settle() waits aren't racing a first-time fetch
      await import('../handlers/addEventListener.js');
      await import('../assignFrom.js');

      // Test 1: the documented example — querySelector LHS, static vector, fromLHS at event time
      {
        const root = makeRoot();
        const host = { age: 10, isHappy: false };
        assignFrom(root, {
          '?.querySelector?.button +=': {
            on: 'click',
            '?.isHappy =!': '.',
            fromLHS: { '?.age +=': '?.dataset?.diff' },
          },
        }, { from: host, withMethods: ['querySelector'] });
        await settle();
        root.querySelector('button').click();
        await settle();
        assertEquals(host.isHappy, true, "'?.querySelector?.button +=' attaches the listener (static vector ran)");
        assertEquals(host.age, 15, 'fromLHS resolved against the button at event time (10 += "5")');
      }

      // Test 2: same through assignFromAsync
      {
        const root = makeRoot();
        const host = { count: 0 };
        await assignFromAsync(root, {
          '?.querySelector?.button +=': { on: 'click', fromLHS: { '?.lastDiff': '?.dataset?.diff' }, '?.count +=': 1 },
        }, { from: host, withMethods: ['querySelector'] });
        await settle();
        root.querySelector('button').click();
        await settle();
        assertEquals(host.lastDiff, '5', 'assignFromAsync: fromLHS resolved at event time');
        assertEquals(host.count, 1, 'assignFromAsync: static vector ran');
      }

      // Test 3: get is still resolved at bind time (abortController from the host)
      {
        const root = makeRoot();
        const controller = new AbortController();
        const host = { count: 0, controller };
        assignFrom(root, {
          '?.querySelector?.button +=': { on: 'click', get: { abortController: '?.controller' }, '?.count +=': 1 },
        }, { from: host, withMethods: ['querySelector'] });
        await settle();
        root.querySelector('button').click();
        controller.abort();
        root.querySelector('button').click();
        await settle();
        assertEquals(host.count, 1, 'get.abortController resolved from the host; abort removes the listener');
      }

      // Test 4: binding on the target itself (' +=' and '?. +=')
      {
        for (const key of [' +=', '?. +=']) {
          const button = document.createElement('button');
          const host = { clicks: 0 };
          assignFrom(button, { [key]: { on: 'click', '?.clicks +=': 1 } }, { from: host });
          await settle();
          button.click();
          await settle();
          assertEquals(host.clicks, 1, `'${key}' binds on the target itself`);
        }
      }

      // Test 5: call shorthand — host method with the event, before the vectors
      {
        const root = makeRoot();
        const order = [];
        const host = {
          count: 0,
          increase(event) { order.push(`call:${event.type}`); this.count++; },
        };
        assignFrom(root, {
          '?.querySelector?.button +=': { on: 'click', call: 'increase', fromHost: { '?.seen': '?.count' } },
        }, { from: host, withMethods: ['querySelector'] });
        await settle();
        root.querySelector('button').click();
        await settle();
        assertEquals(order.join(), 'call:click', 'call invokes the host method with the event');
        assertEquals(host.count, 1, 'method ran once');
        assertEquals(host.seen, 1, 'vectors run after the call');
      }

      // Test 6: ' Y=' through a method-argument path merges into the call's result
      {
        const root = makeRoot();
        assignGingerly(root, { '?.querySelector?.button Y=': { title: 'merged' } }, { withMethods: ['querySelector'] });
        assertEquals(root.querySelector('button').title, 'merged', "' Y=' with a '?.querySelector?.button' LHS");
      }

      // ── dispatch ──────────────────────────────────────────────────────────

      // What a function's synchronous part warns
      function warnings(fn) {
        const { warn } = console;
        const said = [];
        console.warn = (...args) => said.push(args.join(' '));
        try { fn(); } finally { console.warn = warn; }
        return said;
      }
      // A button bound with the config
      async function bindDispatch(config, { host = {}, target = document.createElement('div'), fromStack } = {}) {
        const button = document.createElement('button');
        target.append(button);
        assignFrom(target, { '?.querySelector?.button +=': { on: 'click', ...config } },
          { from: host, withMethods: ['querySelector', 'closest'], fromStack });
        await settle();
        return button;
      }
      function makeSelect() {
        const select = document.createElement('select');
        select.multiple = true;
        select.innerHTML = '<option selected>a</option><option selected>b</option>';
        return select;
      }
      function record(eventTarget, type = 'x') {
        const events = [];
        eventTarget.addEventListener(type, e => events.push(e));
        return events;
      }

      // Test 7: without at, from the element with the listener, with the defaults; also under get
      for (const wrap of [dispatch => ({ dispatch }), dispatch => ({ get: { dispatch } })]) {
        const button = await bindDispatch(wrap({ type: 'x', detail: { n: 1 } }));
        const events = record(button);
        button.click();
        const [e] = events;
        assertEquals(events.length, 1, 'no at: dispatched at the listening element, once');
        assert(e instanceof CustomEvent && e.detail.n === 1 && e.bubbles && e.composed && !e.cancelable, 'no at: a CustomEvent with the defaults');
      }

      // Test 8: a path from the host, dispatched after the static assignments
      {
        const select = makeSelect();
        const option = select.options[0];
        const button = await bindDispatch({ '?.selected': false, dispatch: { type: 'x', at: '?.closest?.select' } }, { host: option });
        const fromButton = record(button);
        const events = record(select);
        let selectedThen;
        select.addEventListener('x', () => { selectedThen = option.selected; });
        button.click();
        assertEquals(events.length, 1, "at: '?.closest?.select' dispatches at the select");
        assertEquals(selectedThen, false, 'its listeners see the static assignments');
        assertEquals(fromButton.length, 0, 'and not at the button');
      }

      // Test 9: the host, root references, and EventTargets
      {
        const host = new EventTarget();
        const parent = new EventTarget();
        const top = { x: new EventTarget() };
        const other = new EventTarget();
        const target = document.createElement('div');
        for (const [at, expected] of [
          ['?.', host], ['$0', target], ['$parent', parent], ['$root?.x', top.x], [other, other], [window, window],
        ]) {
          target.replaceChildren();
          const button = await bindDispatch({ dispatch: { type: 'x', at, bubbles: false } }, { host, target, fromStack: [top, parent] });
          const events = record(expected);
          button.click();
          assertEquals(events.length, 1, `at: ${String(at)}`);
        }
      }

      // Test 10: resolved before call and the assignments, which may detach what the path starts from
      {
        const select = makeSelect();
        const option = select.options[0];
        option.detach = () => option.remove();
        const button = await bindDispatch({ call: 'detach', dispatch: { type: 'x', at: '?.closest?.select' } }, { host: option });
        const events = record(select);
        button.click();
        assertEquals(option.parentNode, null, 'call detached the host');
        assertEquals(events.length, 1, 'the event still goes to the select');
      }

      // Test 11: nothing found, or not an EventTarget: a warning, and no dispatch
      for (const at of ['?.nope', '?.name', 'select', null]) {
        const host = { name: 'n' };
        const button = await bindDispatch({ '?.ran': true, dispatch: { type: 'x', at } }, { host });
        const events = record(button);
        const said = warnings(() => button.click());
        assertEquals(events.length, 0, `at: ${at} isn't dispatched`);
        assertEquals(host.ran, true, `at: ${at}: the assignments still ran`);
        assert(said.length === 1 && said[0].includes(`(${at})`) && said[0].includes('"x"'), `at: ${at} warns`);
      }

      // Test 12: a restricted method isn't called while resolving
      {
        const select = makeSelect();
        const button = document.createElement('button');
        const { attachEventListener } = await import('../handlers/addEventListener.js');
        attachEventListener(button, { on: 'click', dispatch: { type: 'x', at: '?.closest?.select' } },
          button, select.options[0], { withMethods: ['closest'] }, { checkRestrictedMethod: name => name === 'closest' });
        const events = record(select);
        const said = warnings(() => button.click());
        assertEquals(events.length, 0, 'a restricted method in at is not called');
        assertEquals(said.length, 1, 'and there is a warning');
      }

      // Test 13: eventCtr by name
      for (const [eventCtr, ctr, warned] of [['Event', Event, 0], ['CustomEvent', CustomEvent, 0], [Event, Event, 0], ['toString', CustomEvent, 1]]) {
        const button = await bindDispatch({ dispatch: { type: 'x', eventCtr } });
        const events = record(button);
        const said = warnings(() => button.click());
        assertEquals(events[0]?.constructor, ctr, `eventCtr: ${eventCtr.name ?? eventCtr}`);
        assertEquals(said.length, warned, `eventCtr: ${eventCtr.name ?? eventCtr}: ${warned} warnings`);
      }

      // Test 14: in a Tree repeat over a select's options, rerun: $parent is the select, one event per click
      {
        const select = makeSelect();
        const target = document.createElement('div');
        const cfg = { '?. =>': { do: 'builtIns.tree', map: {
          select: ['ul', {}, { of: '?.options', each: ['li', {}, [
            ['button', { ' +=': { on: 'click', '?.selected': false, dispatch: { type: 'change', eventCtr: 'Event', at: '$parent' } } }],
          ]], key: '?.value' }],
        } } };
        for (let i = 0; i < 3; i++) await assignFromAsync(target, cfg, { from: { select: select } });
        await settle();
        const events = record(select, 'change');
        target.querySelector('button')?.click();
        assertEquals(events.length, 1, 'Tree repeat, rerun: one change at the select per click');
        assertEquals(events[0]?.constructor, Event, 'a plain Event');
        assertEquals(select.options[0].selected, false, 'and the option is deselected');
      }

      const testComplete = document.getElementById('test-complete');
      testComplete.setAttribute('data-status', failed === 0 ? 'success' : 'failure');
      testComplete.setAttribute('data-passed', passed);
      testComplete.setAttribute('data-failed', failed);

      results.push(`<h2>Summary: ${passed} passed, ${failed} failed</h2>`);
      document.getElementById('results').innerHTML = results.join('');
    }

    runTests().catch(e => {
      console.error('Test error:', e);
      document.getElementById('results').innerHTML += `<div class="fail">Test suite error: ${e.message}</div>`;
      document.getElementById('test-complete').setAttribute('data-status', 'error');
    });
  </script>
</body>
</html>
