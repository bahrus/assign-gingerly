<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignFrom - ?= Ternary Command Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignFrom - ?= Ternary Command Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0"></div>

    <script type="module">
        import { assignFrom } from '../assignFrom.js';
        import { assignFromAsync } from '../assignFromAsync.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                }
            };
        }

        // Form 1: [ifTruthy, thenResult] — guard
        test('guard: should assign when condition is truthy', () => {
            const target = { textContent: 'original' };
            const vm = { isHappy: true, msg: 'Hello' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.msg']
            }, { from: vm });
            expect(target.textContent).toBe('Hello');
        });

        test('guard: should skip assignment when condition is falsy', () => {
            const target = { textContent: 'original' };
            const vm = { isHappy: false, msg: 'Hello' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.msg']
            }, { from: vm });
            expect(target.textContent).toBe('original');
        });

        test('guard: should skip when condition is null', () => {
            const target = { textContent: 'original' };
            const vm = { isHappy: null, msg: 'Hello' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.msg']
            }, { from: vm });
            expect(target.textContent).toBe('original');
        });

        // Form 2: [ifTruthy, thenResult, elseResult] — ternary
        test('ternary: should assign then-value when truthy', () => {
            const target = { textContent: '' };
            const vm = { isHappy: true, happyMsg: 'I am happy', sadMsg: 'I am sad' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.happyMsg', '?.sadMsg']
            }, { from: vm });
            expect(target.textContent).toBe('I am happy');
        });

        test('ternary: should assign else-value when falsy', () => {
            const target = { textContent: '' };
            const vm = { isHappy: false, happyMsg: 'I am happy', sadMsg: 'I am sad' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.happyMsg', '?.sadMsg']
            }, { from: vm });
            expect(target.textContent).toBe('I am sad');
        });

        test('ternary: should work with literal values', () => {
            const target = { textContent: '' };
            const vm = { isHappy: true };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', 'yes', 'no']
            }, { from: vm });
            expect(target.textContent).toBe('yes');
        });

        test('ternary: should work with literal else value', () => {
            const target = { textContent: '' };
            const vm = { isHappy: false };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', 'yes', 'no']
            }, { from: vm });
            expect(target.textContent).toBe('no');
        });

        // Form 3: [ifTrue, trueResult, falseResult, neitherResult] — three-state
        test('three-state: should assign true-result when strictly true', () => {
            const target = { status: '' };
            const vm = { loaded: true };
            assignFrom(target, {
                '?.status ?=': ['?.loaded', 'ready', 'failed', 'loading']
            }, { from: vm });
            expect(target.status).toBe('ready');
        });

        test('three-state: should assign false-result when strictly false', () => {
            const target = { status: '' };
            const vm = { loaded: false };
            assignFrom(target, {
                '?.status ?=': ['?.loaded', 'ready', 'failed', 'loading']
            }, { from: vm });
            expect(target.status).toBe('failed');
        });

        test('three-state: should assign neither-result when null', () => {
            const target = { status: '' };
            const vm = { loaded: null };
            assignFrom(target, {
                '?.status ?=': ['?.loaded', 'ready', 'failed', 'loading']
            }, { from: vm });
            expect(target.status).toBe('loading');
        });

        test('three-state: should assign neither-result when undefined', () => {
            const target = { status: '' };
            const vm = {};
            assignFrom(target, {
                '?.status ?=': ['?.loaded', 'ready', 'failed', 'loading']
            }, { from: vm });
            expect(target.status).toBe('loading');
        });

        // Form 4: [[lhs, rhs], ifEqual] — equality guard
        test('equality guard: should assign when equal', () => {
            const target = { textContent: '' };
            const vm = { role: 'admin' };
            assignFrom(target, {
                '?.textContent ?=': [['?.role', 'admin'], 'Welcome, admin!']
            }, { from: vm });
            expect(target.textContent).toBe('Welcome, admin!');
        });

        test('equality guard: should skip when not equal', () => {
            const target = { textContent: 'original' };
            const vm = { role: 'user' };
            assignFrom(target, {
                '?.textContent ?=': [['?.role', 'admin'], 'Welcome, admin!']
            }, { from: vm });
            expect(target.textContent).toBe('original');
        });

        // Form 5: [[lhs, rhs], ifEqual, ifNotEqual] — equality ternary
        test('equality ternary: should assign equal-result when match', () => {
            const target = { className: '' };
            const vm = { theme: 'dark' };
            assignFrom(target, {
                '?.className ?=': [['?.theme', 'dark'], 'dark-mode', 'light-mode']
            }, { from: vm });
            expect(target.className).toBe('dark-mode');
        });

        test('equality ternary: should assign not-equal-result when no match', () => {
            const target = { className: '' };
            const vm = { theme: 'light' };
            assignFrom(target, {
                '?.className ?=': [['?.theme', 'dark'], 'dark-mode', 'light-mode']
            }, { from: vm });
            expect(target.className).toBe('light-mode');
        });

        // Comparison with both sides as paths
        test('equality: should compare two resolved paths', () => {
            const target = { textContent: '' };
            const vm = { a: 'hello', b: 'hello' };
            assignFrom(target, {
                '?.textContent ?=': [['?.a', '?.b'], 'match', 'no match']
            }, { from: vm });
            expect(target.textContent).toBe('match');
        });

        test('equality: should detect mismatch between two paths', () => {
            const target = { textContent: '' };
            const vm = { a: 'hello', b: 'world' };
            assignFrom(target, {
                '?.textContent ?=': [['?.a', '?.b'], 'match', 'no match']
            }, { from: vm });
            expect(target.textContent).toBe('no match');
        });

        // Mixed with normal assignments
        test('should mix ?= with normal assignments', () => {
            const target = { textContent: '', title: '' };
            const vm = { isHappy: true, msg: 'Happy!', titleText: 'My Title' };
            assignFrom(target, {
                '?.textContent ?=': ['?.isHappy', '?.msg', 'Sad'],
                '?.title': '?.titleText'
            }, { from: vm });
            expect(target.textContent).toBe('Happy!');
            expect(target.title).toBe('My Title');
        });

        // Multiple ?= in same call
        test('should support multiple ?= keys in same call', () => {
            const target = { a: '', b: '' };
            const vm = { x: true, y: false };
            assignFrom(target, {
                '?.a ?=': ['?.x', 'yes', 'no'],
                '?.b ?=': ['?.y', 'yes', 'no']
            }, { from: vm });
            expect(target.a).toBe('yes');
            expect(target.b).toBe('no');
        });

        // Form 6: [c1, '||', c2, ...] — first truthy candidate
        test("'||' chain: should return the condition itself when truthy", () => {
            const target = { textContent: '' };
            const vm = { nickname: 'Ginger', name: 'Gingerly' };
            assignFrom(target, {
                '?.textContent ?=': ['?.nickname', '||', '?.name']
            }, { from: vm });
            expect(target.textContent).toBe('Ginger');
        });

        test("'||' chain: should assign else-value when condition is falsy", () => {
            const target = { textContent: '' };
            const vm = { nickname: '', name: 'Gingerly' };
            assignFrom(target, {
                '?.textContent ?=': ['?.nickname', '||', '?.name']
            }, { from: vm });
            expect(target.textContent).toBe('Gingerly');
        });

        test("'||' chain: should pick first truthy across multiple candidates", () => {
            const target = { textContent: '' };
            const vm = { a: '', b: 'bee', c: 'cee' };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '||', '?.b', '||', '?.c']
            }, { from: vm });
            expect(target.textContent).toBe('bee');
        });

        test("'||' chain: should return last candidate even when falsy (JS semantics)", () => {
            const target = { value: 'original' };
            const vm = { a: false, b: '', c: 0 };
            assignFrom(target, {
                '?.value ?=': ['?.a', '||', '?.b', '||', '?.c']
            }, { from: vm });
            expect(target.value).toBe(0);
        });

        test("'||' chain: length-4 chain should not be misread as three-state", () => {
            const target = { textContent: '' };
            const vm = { a: '', b: 'bee' };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '||', '?.b', 'fallback']
            }, { from: vm });
            expect(target.textContent).toBe('bee');
        });

        test("'||' chain: length-4 chain should use fallback when all falsy", () => {
            const target = { textContent: '' };
            const vm = { a: '', b: '' };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '||', '?.b', 'fallback']
            }, { from: vm });
            expect(target.textContent).toBe('fallback');
        });

        test("'||' chain: should support literal candidates", () => {
            const target = { textContent: '' };
            const vm = { a: null };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '||', 'literal fallback']
            }, { from: vm });
            expect(target.textContent).toBe('literal fallback');
        });

        test("'||' guard: [c1, '||'] should assign resolved condition when truthy", () => {
            const target = { textContent: '' };
            const vm = { msg: 'Hello' };
            assignFrom(target, {
                '?.textContent ?=': ['?.msg', '||']
            }, { from: vm });
            expect(target.textContent).toBe('Hello');
        });

        test("'||' guard: [c1, '||'] should skip when falsy", () => {
            const target = { textContent: 'original' };
            const vm = { msg: '' };
            assignFrom(target, {
                '?.textContent ?=': ['?.msg', '||']
            }, { from: vm });
            expect(target.textContent).toBe('original');
        });

        // Form 7: [c1, '??', c2, ...] — first non-nullish candidate
        test("'??' chain: should return falsy-but-not-nullish condition (unlike '||')", () => {
            const target = { value: 'original' };
            const vm = { count: 0, fallback: 5 };
            assignFrom(target, {
                '?.value ?=': ['?.count', '??', '?.fallback']
            }, { from: vm });
            expect(target.value).toBe(0);
        });

        test("'??' chain: should assign else-value when condition is null", () => {
            const target = { value: 'original' };
            const vm = { count: null, fallback: 5 };
            assignFrom(target, {
                '?.value ?=': ['?.count', '??', '?.fallback']
            }, { from: vm });
            expect(target.value).toBe(5);
        });

        test("'??' chain: should assign else-value when condition is undefined", () => {
            const target = { value: 'original' };
            const vm = { fallback: 5 };
            assignFrom(target, {
                '?.value ?=': ['?.count', '??', '?.fallback']
            }, { from: vm });
            expect(target.value).toBe(5);
        });

        test("'??' chain: should pick first non-nullish across multiple candidates", () => {
            const target = { textContent: '' };
            const vm = { a: null, c: 'cee' };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '??', '?.b', '??', '?.c']
            }, { from: vm });
            expect(target.textContent).toBe('cee');
        });

        test("'??' chain: should return false when it is the first non-nullish candidate", () => {
            const target = { value: 'original' };
            const vm = { flag: false, fallback: true };
            assignFrom(target, {
                '?.value ?=': ['?.flag', '??', '?.fallback']
            }, { from: vm });
            expect(target.value).toBe(false);
        });

        // Form 8: nested ternaries — [c1, t1, [c2, t2, e2]]
        test('nested: else-position nesting picks nested then-value', () => {
            const target = { textContent: '' };
            const vm = { c1: false, c2: true };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', 'then1', ['?.c2', 'then2', 'else']]
            }, { from: vm });
            expect(target.textContent).toBe('then2');
        });

        test('nested: else-position nesting falls to innermost else', () => {
            const target = { textContent: '' };
            const vm = { c1: false, c2: false };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', 'then1', ['?.c2', 'then2', 'else']]
            }, { from: vm });
            expect(target.textContent).toBe('else');
        });

        test('nested: then-position nesting evaluates when outer condition truthy', () => {
            const target = { textContent: '' };
            const vm = { c1: true, c2: false };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', ['?.c2', 'then2', 'else2'], 'else1']
            }, { from: vm });
            expect(target.textContent).toBe('else2');
        });

        test('nested: three levels deep', () => {
            const target = { textContent: '' };
            const vm = { c1: false, c2: false, c3: true };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', 't1', ['?.c2', 't2', ['?.c3', 't3', 'e']]]
            }, { from: vm });
            expect(target.textContent).toBe('t3');
        });

        test('nested: comparison-mode nesting in else position', () => {
            const target = { textContent: '' };
            const vm = { c1: false, a: 'foo', b: 'foo' };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', 'then1', [['?.a', '?.b'], 'match', 'no match']]
            }, { from: vm });
            expect(target.textContent).toBe('match');
        });

        test('nested: literal array value (no ?. trigger) passes through', () => {
            const target = { value: null };
            const vm = { x: true };
            assignFrom(target, {
                '?.value ?=': ['?.x', ['a', 'b'], 'no']
            }, { from: vm });
            expect(target.value).toEqual(['a', 'b']);
        });

        test('nested: length-1 array is a literal, not a ternary', () => {
            const target = { value: null };
            const vm = { x: true };
            assignFrom(target, {
                '?.value ?=': ['?.x', ['?.a'], 'no']
            }, { from: vm });
            expect(target.value).toEqual(['?.a']);
        });

        test('nested: guard skip in selected branch skips whole assignment', () => {
            const target = { textContent: 'original' };
            const vm = { c1: true, guard: false, v: 'val' };
            assignFrom(target, {
                '?.textContent ?=': ['?.c1', ['?.guard', '?.v'], 'else1']
            }, { from: vm });
            expect(target.textContent).toBe('original');
        });

        test('nested: chain candidate can be a nested ternary', () => {
            const target = { textContent: '' };
            const vm = { a: '', b: true, c: 'see', d: 'dee' };
            assignFrom(target, {
                '?.textContent ?=': ['?.a', '||', ['?.b', '?.c', '?.d']]
            }, { from: vm });
            expect(target.textContent).toBe('see');
        });

        test('nested: chain continues past a nested guard that skips', () => {
            const target = { textContent: '' };
            const vm = { g: false, v: 'val' };
            assignFrom(target, {
                '?.textContent ?=': [['?.g', '?.v'], '||', 'fallback']
            }, { from: vm });
            expect(target.textContent).toBe('fallback');
        });

        // ── { join } results ──────────────────────────────────────────────────

        const pipes = {
            names: { pluck: '?.name' },
            comma: { use: 'join', args: [', '] },
            list: { chain: ['names', 'comma'] },
            usd: { intl: 'NumberFormat', locale: 'en-US', options: { style: 'currency', currency: 'USD' } },
        };
        const crew = [{ name: 'Ada' }, { name: 'Bo' }, { name: 'Cy' }];
        const countOrList = [['?.crew?.length', '>', '?.max'], { join: ['?.crew?.length', ' Selected'] }, '?.crew?.list'];
        const cart = [['?.n', 0], 'Your cart is empty', [['?.n', 1], '1 item', { join: ['?.n', ' items'] }]];
        const states = ['?.ok', { join: ['Saved at ', '?.at'] }, { join: ['Failed: ', '?.err'] }, 'Saving...'];
        const skipped = Symbol('not assigned');
        // [what, ternary, from, expected]
        const joinCases = [
            ['a comparison\'s then', countOrList, { crew, max: 2 }, '3 Selected'],
            ['a comparison\'s then, not chosen', countOrList, { crew, max: 3 }, 'Ada, Bo, Cy'],
            ['a comparison with undefined', countOrList, { crew }, 'Ada, Bo, Cy'],
            ['nested: first', cart, { n: 0 }, 'Your cart is empty'],
            ['nested: second', cart, { n: 1 }, '1 item'],
            ['nested: the join', cart, { n: 2 }, '2 items'],
            ['equality, then', [['?.n', 1], { join: ['one: ', '?.n'] }, 'no'], { n: 1 }, 'one: 1'],
            ['truthiness, then', ['?.name', { join: ['Hi ', '?.name', '!'] }, 'Log in'], { name: 'Ada' }, 'Hi Ada!'],
            ['truthiness, else', ['?.name', '?.name', { join: ['No ', '?.what'] }], { what: 'name' }, 'No name'],
            ['three-state: true', states, { ok: true, at: '10:42' }, 'Saved at 10:42'],
            ['three-state: false', states, { ok: false, err: 'timeout' }, 'Failed: timeout'],
            ['three-state: neither', ['?.ok', 'y', 'n', { join: ['Waiting ', '?.for'] }], { for: 'it' }, 'Waiting it'],
            ['a chain candidate', ['?.nick', '??', { join: ['?.first', ' ', '?.last'] }], { first: 'Ada', last: 'L' }, 'Ada L'],
            ['a chain candidate, not reached', ['?.nick', '??', { join: ['?.first'] }], { nick: 'Al', first: 'Ada' }, 'Al'],
            ['a chain\'s explicit fallback', ['?.a', '||', '?.b', { join: ['none of ', '?.n'] }], { n: 2 }, 'none of 2'],
            ['an empty join isn\'t nullish', ['?.nick', '??', { join: ['?.first'] }, '??', 'Anonymous'], {}, ''],
            ['an empty join is falsy', ['?.nick', '||', { join: ['?.first'] }, '||', 'Anonymous'], {}, 'Anonymous'],
            ['with a pipe', [['?.price', '>', 0], { join: ['Only ', '?.price?.usd'] }, 'Free'], { price: 12.5 }, 'Only $12.50'],
            ['optional parts', ['?.l', { join: ['?.l', [', ', '?.m'], ', ', '?.f'] }, '?'], { l: 'L', f: 'A' }, 'L, A'],
            ['optional parts, present', ['?.l', { join: ['?.l', [', ', '?.m'], ', ', '?.f'] }, '?'], { l: 'L', m: 'D', f: 'A' }, 'L, D, A'],
            ['a separator', ['?.a', { join: ['?.a', '?.b'], separator: ' | ' }, '-'], { a: 1, b: 2 }, '1 | 2'],
            ['a guard', [['?.n', '>', 0], { join: ['?.n', ' new'] }], { n: 3 }, '3 new'],
            ['a guard that skips', [['?.n', '>', 0], { join: ['?.n', ' new'] }], { n: 0 }, skipped],
            ['other keys: a literal', ['?.a', { join: 1, x: 2 }, '-'], { a: 1 }, { join: 1, x: 2 }],
        ];
        await import('../pipes/dataPipes.js');
        for (const [what, ternary, from, expected] of joinCases) {
            const check = target => {
                if (expected === skipped) expect('v' in target).toBe(false);
                else if (typeof expected === 'object') expect(target.v).toEqual(expected);
                else expect(target.v).toBe(expected);
            };
            test(`join: ${what}`, () => check(assignFrom({}, { 'v ?=': ternary }, { from, pipes })));
            const asyncTarget = await assignFromAsync({}, { 'v ?=': ternary }, { from, pipes });
            test(`join (assignFromAsync): ${what}`, () => check(asyncTarget));
        }

        test('join: an attribute-backed property, and reruns', () => {
            const a = document.createElement('a');
            const run = from => {
                assignFrom(a, { 'href ?=': ['?.id', { join: ['#product/', '?.id'] }, '#'] }, { from });
                return a.getAttribute('href');
            };
            expect([run({ id: 7 }), run({}), run({ id: 8 })].join()).toBe('#product/7,#,#product/8');
        });

        test('join: $0, $root, $parent and !', () => {
            const target = assignFrom({ own: 'o' }, {
                'v ?=': ['?.a', { join: ['$0?.own', '$root?.r', '$parent?.p', '!?.a'] }, '-'],
            }, { from: { a: 1 }, fromStack: [{ r: 'r' }, { p: 'p' }] });
            expect(target.v).toBe('orpfalse');
        });

        test('join: withMethods, aka and protocols', () => {
            const target = assignFrom({}, { 'v ?=': ['?.a', { join: ['?.a?.up|', '-', 'p://k'] }, '-'] }, {
                from: { a: 'x' }, withMethods: ['toUpperCase'], aka: { 'up|': 'toUpperCase|' }, protocols: { p: key => `[${key}]` },
            });
            expect(target.v).toBe('X-[k]');
        });

        test('join: the branch that isn\'t chosen isn\'t resolved', () => {
            let reads = 0;
            const from = { a: 1, get b() { reads++; return 'b'; } };
            const target = assignFrom({}, { 'v ?=': ['?.a', 'yes', { join: ['?.b'] }] }, { from });
            expect(target.v).toBe('yes');
            expect(reads).toBe(0);
        });

        test('join: a Promise from a protocol throws', () => {
            let message = '';
            try {
                assignFrom({}, { 'v ?=': ['?.a', { join: ['p://k'] }, '-'] }, { from: { a: 1 }, protocols: { p: async () => 'x' } });
            } catch (e) { message = e.message; }
            expect(message.includes('received an async value') && message.includes('?=')).toBe(true);
        });

        // Display results
        const total = passed + failed;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');

        statusEl.innerHTML = `<span class="${failed === 0 ? 'pass' : 'fail'}">${passed}/${total} tests passed</span>`;

        results.forEach(result => {
            const div = document.createElement('div');
            div.className = `test-item ${result.status}`;
            div.innerHTML = `<strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}${result.error ? `<div class="error">${result.error}</div>` : ''}`;
            resultsEl.appendChild(div);
        });

        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', total.toString());

        console.log(`Tests complete: ${passed}/${total} passed`);
    </script>
</body>
</html>
