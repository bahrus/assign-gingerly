<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignGingerly - =! Command Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignGingerly - =! Command Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0"></div>

    <script type="module">
        import assignGingerly from '../assignGingerly.js';
        import { assignFrom } from '../assignFrom.js';
        import { assignFromAsync } from '../assignFromAsync.js';
        import { assignTentatively } from '../assignTentatively.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toThrow(message) {
                    try {
                        actual();
                    } catch (error) {
                        if (!error.message.includes(message)) throw new Error(`Threw "${error.message}"`);
                        return;
                    }
                    throw new Error('Expected it to throw');
                }
            };
        }

        // Run all tests
        test('should toggle self with =! and RHS="."', () => {
            const obj = { value: true };
            assignGingerly(obj, { '?.value =!': '.' });
            expect(obj.value).toBe(false);
        });

        test('should toggle false to true with self-reference', () => {
            const obj = { active: false };
            assignGingerly(obj, { '?.active =!': '.' });
            expect(obj.active).toBe(true);
        });

        test('should negate a value from from with the ! marker', () => {
            const target = { e: false };
            assignFrom(target, { '?.r': '!?.e' }, { from: { e: true } });
            expect(target.r).toBe(false);
        });

        test('should negate a value on the target with the ! marker and $0', () => {
            const target = { e: true };
            assignFrom(target, { '?.r': '!$0?.e' }, { from: { e: false } });
            expect(target.r).toBe(false);
        });

        test('should negate a value from another branch of the target', () => {
            const target = { a: { b: { c: true } } };
            assignFrom(target, { '?.a?.d?.e': '!$0?.a?.b?.c' }, { from: {} });
            expect(target.a.d.e).toBe(false);
        });

        test('should toggle itself in assignFrom, whatever from holds', () => {
            const target = { r: true };
            assignFrom(target, { '?.r =!': '.' }, { from: { r: true } });
            expect(target.r).toBe(false);
        });

        test('should negate a missing value to true', () => {
            const target = {};
            assignFrom(target, { '?.r': '!?.nonexistent?.path', '?.s': '!$0?.nonexistent?.path' }, { from: {} });
            expect(target.r).toBe(true);
            expect(target.s).toBe(true);
        });

        test('should negate a string value, without reading it again', () => {
            for (const [text, expected] of [['', true], ['hi', false], ['x', false], ['?.x', false], ['.', false]]) {
                const target = { x: false };
                assignFrom(target, { '?.r': '!?.text' }, { from: { text } });
                expect(target.r).toBe(expected);
            }
        });

        test('should handle README example', () => {
            const obj = {
                a: {
                    b: {
                        c: true
                    }
                }
            };
            
            assignGingerly(obj, {
                '?.a?.b?.c =!': '.',
                '?.a?.d?.e =!': '.'
            });
            
            expect(obj).toEqual({
                a: {
                    b: { c: false },
                    d: { e: true }
                }
            });
        });

        test('should create intermediate nested structures', () => {
            const obj = {};
            assignGingerly(obj, { '?.x?.y?.z =!': '.' });
            expect(obj).toEqual({
                x: {
                    y: {
                        z: true
                    }
                }
            });
        });

        test('should handle multiple =! commands', () => {
            const obj = { a: true, b: false, c: true };
            assignGingerly(obj, {
                '?.a =!': '.',
                '?.b =!': '.',
                '?.c =!': '.'
            });
            expect(obj).toEqual({
                a: false,
                b: true,
                c: false
            });
        });

        test('should mix =! with regular assignments', () => {
            const obj = { flag: true };
            assignGingerly(obj, {
                '?.flag =!': '.',
                'name': 'test'
            });
            expect(obj).toEqual({
                flag: false,
                name: 'test'
            });
        });

        test('should mix =! with += commands', () => {
            const obj = { count: 5, enabled: true };
            assignGingerly(obj, {
                '?.count +=': 3,
                '?.enabled =!': '.'
            });
            expect(obj.count).toBe(8);
            expect(obj.enabled).toBe(false);
        });

        test('should toggle non-boolean values', () => {
            const obj = { zero: 0, text: 'hello', list: [], missing: null };
            assignGingerly(obj, { '?.zero =!': '.', '?.text =!': '.', '?.list =!': '.', '?.missing =!': '.' });
            expect(obj).toEqual({ zero: true, text: false, list: false, missing: true });
        });

        test('should handle very deep nested paths', () => {
            const obj = { a: { b: { c: { d: { e: true } } } } };
            assignGingerly(obj, { '?.a?.b?.c?.d?.e =!': '.' });
            expect(obj.a.b.c.d.e).toBe(false);
        });

        test('should handle special characters in property names', () => {
            const obj = { 'my-prop': true };
            assignGingerly(obj, { '?.my-prop =!': '.' });
            expect(obj['my-prop']).toBe(false);
        });

        test('should preserve other properties when toggling', () => {
            const obj = { toggleMe: true, keepMe: 'unchanged', nested: { value: 42 } };
            assignGingerly(obj, { '?.toggleMe =!': '.' });
            expect(obj).toEqual({
                toggleMe: false,
                keepMe: 'unchanged',
                nested: { value: 42 }
            });
        });

        test('should handle self-negation on non-existent property', () => {
            const obj = {};
            assignGingerly(obj, { '?.newProp =!': '.' });
            expect(obj.newProp).toBe(true);
        });

        test('should negate any type with the ! marker', () => {
            const from = { zero: 0, one: 1, nothing: null, array: [], object: {} };
            const target = {};
            assignFrom(target, {
                '?.zero': '!?.zero', '?.one': '!?.one', '?.nothing': '!?.nothing', '?.array': '!?.array', '?.object': '!?.object'
            }, { from });
            expect(target).toEqual({ zero: true, one: false, nothing: true, array: false, object: false });
        });

        test('should only take "." as the right hand side of =!', () => {
            for (const rhs of ['?.value', 'value', true, false, 0, null]) {
                expect(() => assignGingerly({ value: 1 }, { '?.r =!': rhs })).toThrow('toggles itself');
                expect(() => assignGingerly({ value: 1 }, { 'r =!': rhs })).toThrow('toggles itself');
                expect(() => assignFrom({}, { '?.r =!': rhs }, { from: {} })).toThrow('toggles itself');
                expect(() => assignTentatively({ value: 1 }, { '?.r =!': rhs })).toThrow('toggles itself');
                expect(() => assignGingerly({ items: [{}] }, { '?.items?.@each?.r =!': rhs })).toThrow('toggles itself');
            }
        });

        test('should not let data stand in for the "." of =!', () => {
            const target = { r: false };
            expect(() => assignFrom(target, { '?.r =!': '?.s' }, { from: { s: '.' } })).toThrow('toggles itself');
            expect(target.r).toBe(false);
        });

        test('should leave right hand sides alone in assignGingerly', () => {
            const obj = { e: true, title: 'a' };
            assignGingerly(obj, { title: '!.', '?.r': '!$0?.e', '?.s': '?.e' });
            expect(obj).toEqual({ e: true, title: '!.', r: '!$0?.e', s: '?.e' });
        });

        test('should write "!." as text in assignFrom', () => {
            const target = { title: 'a', other: 'b' };
            assignFrom(target, { title: '?.text', other: '!.' }, { from: { text: '!.' } });
            expect(target).toEqual({ title: '!.', other: '!.' });
        });

        test('should toggle each item with @each when withMethods is provided and path has one segment', () => {
            // Regression: evaluatePathWithMethods returns the container for a single-segment
            // property path, not the property value.
            const obj = { items: [{ hidden: true }, { hidden: false }] };
            assignGingerly(obj, {
                '?.items?.@each?.hidden =!': '.'
            }, { withMethods: ['someMethod'] }); // withMethodsSet present but not used by this path
            expect(obj.items).toEqual([{ hidden: false }, { hidden: true }]);
        });

        test('should toggle each item with @each and self-reference', () => {
            const obj = {
                items: [{ hidden: true }, { hidden: false }, { hidden: true }]
            };
            assignGingerly(obj, {
                '?.items?.@each?.hidden =!': '.'
            });
            expect(obj.items[0].hidden).toBe(false);
            expect(obj.items[1].hidden).toBe(true);
            expect(obj.items[2].hidden).toBe(false);
        });

        test('should toggle each item with nested @each', () => {
            const obj = {
                groups: [
                    { items: [{ hidden: false }, { hidden: true }] },
                    { items: [{ hidden: false }] }
                ]
            };
            assignGingerly(obj, {
                '?.groups?.@each?.items?.@each?.hidden =!': '.'
            });
            expect(obj.groups).toEqual([
                { items: [{ hidden: true }, { hidden: false }] },
                { items: [{ hidden: true }] }
            ]);
        });

        test('should negate one value into each item with @each and the ! marker', () => {
            const target = { controls: [{ hidden: true }, { hidden: true }, { hidden: true }] };
            assignFrom(target, {
                '?.controls?.@each?.hidden': '!?.expanded'
            }, { from: { expanded: true } });
            for (const item of target.controls) {
                expect(item.hidden).toBe(false);
            }
        });

        try {
            await assignFromAsync({}, { '?.r =!': '?.s' }, { from: { s: '.' } });
            test('should check =! in assignFromAsync', () => { throw new Error('Expected it to throw'); });
        } catch (error) {
            test('should check =! in assignFromAsync', () => expect(error.message.includes('toggles itself')).toBe(true));
        }

        const asyncTarget = { x: false };
        await assignFromAsync(asyncTarget, { '?.r': '!?.s', '?.t': '!$0?.x', '?.u =!': '.' }, { from: { s: 'x' } });
        test('should negate and toggle in assignFromAsync', () => {
            expect(asyncTarget).toEqual({ x: false, r: false, t: true, u: true });
        });

        // Display results
        const total = passed + failed;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');

        statusEl.innerHTML = `<span class="${failed === 0 ? 'pass' : 'fail'}">${passed}/${total} tests passed</span>`;

        results.forEach(result => {
            const div = document.createElement('div');
            div.className = `test-item ${result.status}`;
            div.innerHTML = `<strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}${result.error ? `<div class="error">${result.error}</div>` : ''}`;
            resultsEl.appendChild(div);
        });

        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', total.toString());

        console.log(`Tests complete: ${passed}/${total} passed`);
    </script>
</body>
</html>
