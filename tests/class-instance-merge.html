<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Instance Merge Tests</title>
</head>
<body>
    <h1>Class Instance Merge Tests</h1>
    <div id="results"></div>

    <script type="module">
        import assignGingerly from '../assignGingerly.js';
        import '../object-extension.js';  // Import to get readonly enh property

        const results = [];
        let testCount = 0;
        let passCount = 0;

        function test(name, fn) {
            testCount++;
            try {
                fn();
                passCount++;
                results.push(`✓ ${name}`);
                console.log(`✓ ${name}`);
            } catch (error) {
                results.push(`✗ ${name}: ${error.message}`);
                console.error(`✗ ${name}:`, error);
            }
        }

        // Define test classes
        class MyEnhancement {
            constructor(element, ctx, initVals) {
                this.element = element;
                this.ctx = ctx;
                this.instanceId = Math.random();
                if (initVals) {
                    Object.assign(this, initVals);
                }
            }
            prop1 = null;
            prop2 = null;
        }

        class AnotherEnhancement {
            constructor() {
                this.instanceId = Math.random();
            }
            value = null;
        }

        // Test 1: Merge into readonly enh property still works
        test('should merge into readonly enh property', () => {
            const element = document.createElement('div');
            // enh is a readonly getter on Element.prototype
            // Assigning into it should merge, not replace
            element.enh.myEnh = new MyEnhancement(element, {}, {});
            
            const originalId = element.enh.myEnh.instanceId;
            
            // enh is readonly, so this merges into the enh container
            assignGingerly(element, {
                enh: {
                    myEnh: {
                        prop1: 'value1',
                        prop2: 'value2'
                    }
                }
            });
            
            // enh container is preserved (readonly), but myEnh is replaced (writable class instance)
            if (element.enh.myEnh.prop1 !== 'value1') {
                throw new Error(`Expected prop1 to be 'value1', got '${element.enh.myEnh.prop1}'`);
            }
            if (element.enh.myEnh.prop2 !== 'value2') {
                throw new Error(`Expected prop2 to be 'value2', got '${element.enh.myEnh.prop2}'`);
            }
        });

        // Test 2: Class instances on writable properties are replaced
        test('should replace class instance on writable property', () => {
            const element = document.createElement('div');
            element.enh.myEnh = new MyEnhancement(element, {}, {});
            
            const originalId = element.enh.myEnh.instanceId;
            
            assignGingerly(element, {
                enh: { myEnh: { prop1: 'first' } }
            });
            
            // myEnh is writable, so the class instance is replaced with a plain object
            if (element.enh.myEnh.instanceId === originalId) {
                throw new Error('Instance should have been replaced, not merged');
            }
            if (element.enh.myEnh.prop1 !== 'first') {
                throw new Error(`Expected prop1 to be 'first', got '${element.enh.myEnh.prop1}'`);
            }
            // instanceId should not exist on the replacement plain object
            if (element.enh.myEnh.instanceId !== undefined) {
                throw new Error('Replacement should not have instanceId');
            }
        });

        // Test 3: Plain objects are replaced (simple assignment)
        test('should replace plain objects (not class instances)', () => {
            const obj = {
                config: { old: 'value' }
            };
            
            assignGingerly(obj, {
                config: { new: 'value' }
            });
            
            // Plain objects with writable properties are replaced via simple assignment
            if (obj.config.old !== undefined) {
                throw new Error(`Expected old to be undefined (replaced), got '${obj.config.old}'`);
            }
            if (obj.config.new !== 'value') {
                throw new Error(`Expected new to be 'value', got '${obj.config.new}'`);
            }
        });

        // Test 4: Class instance at root level is replaced
        test('should replace class instance at root level', () => {
            const obj = {
                enhancement: new AnotherEnhancement()
            };
            
            const originalId = obj.enhancement.instanceId;
            
            assignGingerly(obj, {
                enhancement: {
                    value: 'test'
                }
            });
            
            // Class instance should be replaced, not merged
            if (obj.enhancement.instanceId === originalId) {
                throw new Error('Instance should have been replaced');
            }
            if (obj.enhancement.value !== 'test') {
                throw new Error(`Expected value to be 'test', got '${obj.enhancement.value}'`);
            }
        });

        // Test 5: Nested class instance via path is replaced
        test('should replace nested class instance via path', () => {
            const obj = {
                data: {
                    enhancement: new AnotherEnhancement()
                }
            };
            
            const originalId = obj.data.enhancement.instanceId;
            
            assignGingerly(obj, {
                '?.data?.enhancement': {
                    value: 'nested'
                }
            });
            
            // Class instance should be replaced
            if (obj.data.enhancement.instanceId === originalId) {
                throw new Error('Instance should have been replaced');
            }
            if (obj.data.enhancement.value !== 'nested') {
                throw new Error(`Expected value to be 'nested', got '${obj.data.enhancement.value}'`);
            }
        });

        // Test 6: Replacing class instance with another object (real-world use case)
        test('should replace DocumentFragment-like class with element reference', () => {
            // Simulates the real-world use case: clone was a DocumentFragment,
            // now we want to replace it with the web component itself
            class FakeDocumentFragment {
                constructor() {
                    this.nodeType = 11;
                    this.childNodes = [];
                }
            }
            
            const obj = {
                clone: new FakeDocumentFragment()
            };
            
            const element = document.createElement('div');
            
            assignGingerly(obj, {
                clone: element
            });
            
            // Should have replaced the DocumentFragment with the element
            if (obj.clone !== element) {
                throw new Error('clone should be the element, not the DocumentFragment');
            }
        });

        // Test 7: Readonly properties still trigger merge
        test('should still merge into readonly properties', () => {
            const obj = {};
            Object.defineProperty(obj, 'config', {
                value: { a: 1, b: 2 },
                writable: false,
                configurable: false
            });
            
            assignGingerly(obj, {
                config: { c: 3 }
            });
            
            // Readonly property should be merged into
            if (obj.config.a !== 1) throw new Error('Original prop a should be preserved');
            if (obj.config.b !== 2) throw new Error('Original prop b should be preserved');
            if (obj.config.c !== 3) throw new Error('New prop c should be added');
        });

        // Test 8: Array values are not treated as class instances
        test('should not treat arrays as class instances', () => {
            const obj = {
                items: [1, 2, 3]
            };
            
            assignGingerly(obj, {
                items: [4, 5, 6]
            });
            
            // Arrays should be replaced, not merged
            if (obj.items.length !== 3) {
                throw new Error(`Expected 3 items, got ${obj.items.length}`);
            }
            if (obj.items[0] !== 4) {
                throw new Error(`Expected first item to be 4, got ${obj.items[0]}`);
            }
        });

        // Test 9: Readonly accessor (getter-only) still triggers merge
        test('should merge into readonly accessor property', () => {
            const inner = { color: 'red', size: 10 };
            const obj = {};
            Object.defineProperty(obj, 'style', {
                get() { return inner; },
                // no setter = readonly
                configurable: false
            });
            
            assignGingerly(obj, {
                style: { color: 'blue' }
            });
            
            if (obj.style.color !== 'blue') throw new Error('color should be merged');
            if (obj.style.size !== 10) throw new Error('size should be preserved');
        });

        // Test 10: Replacing class instance preserves other properties
        test('should replace class instance without affecting siblings', () => {
            const obj = {
                enhancement: new AnotherEnhancement(),
                config: { old: 'value' }
            };
            
            assignGingerly(obj, {
                enhancement: { value: 'test' }
            });
            
            // Class instance replaced
            if (obj.enhancement instanceof AnotherEnhancement) {
                throw new Error('Enhancement should no longer be an AnotherEnhancement instance');
            }
            if (obj.enhancement.value !== 'test') {
                throw new Error('Enhancement value should be test');
            }
            
            // Sibling untouched
            if (obj.config.old !== 'value') {
                throw new Error('Config should be untouched');
            }
        });

        // Display results
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = `
            <h2>Results: ${passCount}/${testCount} tests passed</h2>
            <pre>${results.join('\n')}</pre>
        `;

        // Report to parent (for Playwright)
        if (window.testResults) {
            window.testResults = { passed: passCount, total: testCount, results };
        } else {
            window.testResults = { passed: passCount, total: testCount, results };
        }
    </script>
</body>
</html>
