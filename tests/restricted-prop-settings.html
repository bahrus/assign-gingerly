<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>assignGingerly - Restricted Property Settings</title>
</head>
<body>
    <h1>Restricted Property Settings — Phase I Tests</h1>
    <div id="status">Running tests...</div>
    <div id="results"></div>
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0"></div>

    <script type="module">
        import assignGingerly from '../assignGingerly.js';
        import { assignFrom } from '../assignFrom.js';
        import assignTentatively from '../assignTentatively.js';
        import { attachEventListener } from '../handlers/addEventListener.js';
        import { PermissionProcessor } from '../assignPermissions/PermissionProcessor.js';

        const results = [];
        let passed = 0;
        let failed = 0;
        const permissionProcessor = new PermissionProcessor({ restrictedPropSettings: ['innerHTML', 'src'] });

        async function test(name, fn) {
            try {
                await fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toBe(expected) {
                    if (actual !== expected) throw new Error(`Expected ${expected} but got ${actual}`);
                },
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                }
            };
        }

        await test('blocks plain and nested property assignments while allowing siblings', () => {
            const target = { innerHTML: 'safe', nested: { innerHTML: 'safe' } };
            assignGingerly(target, {
                innerHTML: 'blocked',
                title: 'allowed',
                '?.nested?.innerHTML': 'blocked',
                '?.nested?.title': 'allowed'
            }, undefined, permissionProcessor);
            expect(target.innerHTML).toBe('safe');
            expect(target.title).toBe('allowed');
            expect(target.nested.innerHTML).toBe('safe');
            expect(target.nested.title).toBe('allowed');
        });

        await test('blocks += and =! assignments but does not block -=', () => {
            const target = { src: 'a', innerHTML: true };
            assignGingerly(target, {
                'src +=': 'b',
                'innerHTML =!': '.',
                ' -=': 'innerHTML'
            }, undefined, permissionProcessor);
            expect(target).toEqual({ src: 'a' });
        });

        await test('preserves restrictions during readonly recursive merges', () => {
            const target = {};
            Object.defineProperty(target, 'config', { value: { innerHTML: 'safe' }, writable: false });
            assignGingerly(target, { config: { innerHTML: 'blocked', title: 'allowed' } }, undefined, permissionProcessor);
            expect(target.config).toEqual({ innerHTML: 'safe', title: 'allowed' });
        });

        await test('preserves restrictions through @each', () => {
            const target = { rows: [{ innerHTML: 'safe' }, { innerHTML: 'safe' }] };
            assignGingerly(target, { '?.rows?.@each?.innerHTML': 'blocked' }, undefined, permissionProcessor);
            expect(target.rows).toEqual([{ innerHTML: 'safe' }, { innerHTML: 'safe' }]);
        });

        await test('assignFrom forwards permissions to resolved assignments', () => {
            const target = { innerHTML: 'safe' };
            assignFrom(target, { innerHTML: '?.value', title: '?.value' }, { from: { value: 'blocked' } }, permissionProcessor);
            expect(target).toEqual({ innerHTML: 'safe', title: 'blocked' });
        });

        await test('assignTentatively skips restricted settings without a reversal entry', () => {
            const target = { innerHTML: 'safe', title: 'old' };
            const reversal = {};
            assignTentatively(target, { innerHTML: 'blocked', title: 'new' }, { reversal }, permissionProcessor);
            expect(target).toEqual({ innerHTML: 'safe', title: 'new' });
            expect(reversal).toEqual({ title: 'old' });
        });

        await test('event-vector assignments inherit permissions', () => {
            const button = document.createElement('button');
            const target = { innerHTML: 'safe' };
            attachEventListener(button, {
                on: 'click',
                toTarget: { innerHTML: 'blocked', title: 'allowed' }
            }, target, target, {}, permissionProcessor);
            button.click();
            expect(target).toEqual({ innerHTML: 'safe', title: 'allowed' });
        });

        await test('redirects direct and nested ordinary assignments to the configured method', () => {
            const calls = [];
            const target = {
                replaceWithHTML(value) { calls.push(['root', value]); },
                nested: {
                    replaceWithHTML(value) { calls.push(['nested', value]); }
                }
            };
            const redirectPermissionProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'outerHTML', useMethod: 'replaceWithHTML' }]
            });
            assignGingerly(target, {
                outerHTML: '<p>root</p>',
                '?.nested?.outerHTML': '<p>nested</p>'
            }, undefined, redirectPermissionProcessor);
            expect(calls).toEqual([['root', '<p>root</p>'], ['nested', '<p>nested</p>']]);
        });

        await test('fails closed when a configured redirect method is unavailable', () => {
            const target = { outerHTML: 'safe' };
            const redirectPermissionProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'outerHTML', useMethod: 'replaceWithHTML' }]
            });
            assignGingerly(target, { outerHTML: 'blocked' }, undefined, redirectPermissionProcessor);
            expect(target.outerHTML).toBe('safe');
        });

        await test('blocks commands for redirected properties', () => {
            const calls = [];
            const target = {
                outerHTML: 'safe',
                replaceWithHTML(value) { calls.push(value); }
            };
            const redirectPermissionProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'outerHTML', useMethod: 'replaceWithHTML' }]
            });
            assignGingerly(target, {
                'outerHTML +=': ' appended',
                'outerHTML =!': '.',
                'outerHTML Y=': { value: 'ignored' }
            }, undefined, redirectPermissionProcessor);
            expect(target.outerHTML).toBe('safe');
            expect(calls).toEqual([]);
        });

        await test('assignFrom retains a redirect policy', () => {
            const calls = [];
            const target = {
                replaceWithHTML(value) { calls.push(value); }
            };
            const redirectPermissionProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'outerHTML', useMethod: 'replaceWithHTML' }]
            });
            assignFrom(target, { outerHTML: '?.html' }, { from: { html: '<p>resolved</p>' } }, redirectPermissionProcessor);
            expect(calls).toEqual(['<p>resolved</p>']);
        });

        await test('rejects duplicate property policies', () => {
            let didThrow = false;
            try {
                const duplicateProcessor = new PermissionProcessor({
                    restrictedPropSettings: [
                        'outerHTML',
                        { props: 'outerHTML', useMethod: 'replaceWithHTML' }
                    ]
                });
                assignGingerly({}, { outerHTML: 'blocked' }, undefined, duplicateProcessor);
            } catch (error) {
                didThrow = true;
            }
            expect(didThrow).toBe(true);
        });

        await test('Phase III: allows same-origin src property assignment', () => {
            const img = document.createElement('img');
            const phaseProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'src', allowFromSameDomain: true }]
            });
            assignGingerly(img, { src: '/tests/restricted-prop-settings.html' }, undefined, phaseProcessor);
            expect(img.getAttribute('src')).toBe('/tests/restricted-prop-settings.html');
        });

        await test('Phase III: blocks cross-origin src property assignment', () => {
            const img = document.createElement('img');
            const phaseProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'src', allowFromSameDomain: true }]
            });
            assignGingerly(img, { src: 'https://example.com/x.png' }, undefined, phaseProcessor);
            expect(img.getAttribute('src')).toBe(null);
        });

        await test('Phase III: blocks src assignment when both flags are false', () => {
            const img = document.createElement('img');
            const phaseProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'src', allowFromSameDomain: false, allowCrossDomain: false }]
            });
            assignGingerly(img, { src: '/tests/restricted-prop-settings.html' }, undefined, phaseProcessor);
            expect(img.getAttribute('src')).toBe(null);
        });

        await test('Phase III: allowCrossDomain permits any src', () => {
            const img = document.createElement('img');
            const phaseProcessor = new PermissionProcessor({
                restrictedPropSettings: [{ props: 'src', allowCrossDomain: true }]
            });
            assignGingerly(img, { src: 'https://example.com/x.png' }, undefined, phaseProcessor);
            expect(img.getAttribute('src')).toBe('https://example.com/x.png');
        });

        await test('Phase I: blocks a method listed in withMethods', () => {
            const target = {
                value: 'safe',
                setHTMLUnsafe(value) { this.value = value; }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe': 'blocked'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(target.value).toBe('safe');
        });

        await test('Phase I: blocks zero-arg method marker for restricted method', () => {
            const target = {
                value: 'safe',
                setHTMLUnsafe() { this.value = 'called'; }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe|': true
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(target.value).toBe('safe');
        });

        await test('Phase I: blocks akaMethods alias to a restricted method', () => {
            const target = {
                value: 'safe',
                setHTMLUnsafe(value) { this.value = value; }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                '?.dangerous': 'blocked'
            }, { akaMethods: { dangerous: 'setHTMLUnsafe' } }, methodProcessor);
            expect(target.value).toBe('safe');
        });

        await test('Phase I: restricted method in middle of chain falls back to property access', () => {
            const inner = { setHTMLUnsafe: { dangerous: 'safe' } };
            const target = {
                next() { return inner; },
                setHTMLUnsafe(value) { throw new Error('should not be called'); }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                '?.next?.setHTMLUnsafe?.dangerous': 'changed'
            }, { withMethods: ['next', 'setHTMLUnsafe'] }, methodProcessor);
            expect(inner.setHTMLUnsafe.dangerous).toBe('changed');
        });

        await test('Phase I: direct property access without withMethods is unaffected', () => {
            const target = {
                setHTMLUnsafe: 'safe'
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                setHTMLUnsafe: 'allowed'
            }, undefined, methodProcessor);
            expect(target.setHTMLUnsafe).toBe('allowed');
        });

        await test('Phase II: object-form appends literal args to method calls', () => {
            const calls = [];
            const target = {
                setHTMLUnsafe(value, extra) { calls.push([value, extra]); }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: [
                    { method: 'setHTMLUnsafe', appendArgs: ['sanitizer'] }
                ]
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe': 'allowed'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([['allowed', 'sanitizer']]);
        });

        await test('Phase II: appendArgs resolves ?.sanitizerOptions from permissions', () => {
            const calls = [];
            const target = {
                setHTMLUnsafe(value, options) { calls.push([value, options]); }
            };
            const sanitizerOptions = { allowElements: ['div'] };
            const methodProcessor = new PermissionProcessor({
                sanitizerOptions,
                restrictedMethodSettings: [
                    { method: 'setHTMLUnsafe', appendArgs: ['?.sanitizerOptions'] }
                ]
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe': 'allowed'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([['allowed', sanitizerOptions]]);
        });

        await test('Phase II: appendArgs resolves ?.customSettings from permissions', () => {
            const calls = [];
            const target = {
                setHTMLUnsafe(value, settings) { calls.push([value, settings]); }
            };
            const customSettings = { policy: 'strict' };
            const methodProcessor = new PermissionProcessor({
                customSettings,
                restrictedMethodSettings: [
                    { method: 'setHTMLUnsafe', appendArgs: ['?.customSettings'] }
                ]
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe': 'allowed'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([['allowed', customSettings]]);
        });

        await test('Phase II: zero-arg marker gets appended args', () => {
            const calls = [];
            const target = {
                setHTMLUnsafe(extra) { calls.push([extra]); }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: [
                    { method: 'setHTMLUnsafe', appendArgs: ['sanitizer'] }
                ]
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe|': 'ignored'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([['sanitizer']]);
        });

        await test('Phase II: middle-chain method gets appended args', () => {
            const calls = [];
            const target = {
                getWrapper(extra) {
                    calls.push(['getWrapper', extra]);
                    return {
                        setHTMLUnsafe(value) { calls.push(['setHTMLUnsafe', value]); }
                    };
                }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: [
                    { method: 'getWrapper', appendArgs: ['wrapperArg'] }
                ]
            });
            assignGingerly(target, {
                '?.getWrapper?.setHTMLUnsafe': 'allowed'
            }, { withMethods: ['getWrapper', 'setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([['getWrapper', 'wrapperArg'], ['setHTMLUnsafe', 'allowed']]);
        });

        await test('Phase I: string entry still blocks method calls', () => {
            const calls = [];
            const target = {
                setHTMLUnsafe(value) { calls.push(value); }
            };
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignGingerly(target, {
                '?.setHTMLUnsafe': 'allowed'
            }, { withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(calls).toEqual([]);
        });

        await test('Phase II: duplicate configured method entries throw', () => {
            let threw = false;
            try {
                new PermissionProcessor({
                    restrictedMethodSettings: [
                        { method: 'setHTMLUnsafe', appendArgs: ['a'] },
                        { method: 'setHTMLUnsafe', appendArgs: ['b'] }
                    ]
                });
            } catch (e) {
                threw = true;
            }
            expect(threw).toBe(true);
        });

        await test('Phase I: assignFrom RHS resolution blocks restricted methods', () => {
            const source = {
                value: 'safe',
                setHTMLUnsafe(value) { this.value = value; }
            };
            const target = {};
            const methodProcessor = new PermissionProcessor({
                restrictedMethodSettings: ['setHTMLUnsafe']
            });
            assignFrom(target, {
                result: '?.setHTMLUnsafe'
            }, { from: source, withMethods: ['setHTMLUnsafe'] }, methodProcessor);
            expect(typeof target.result).toBe('function');
            expect(source.value).toBe('safe');
        });

        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');
        statusEl.textContent = `${passed}/${passed + failed} tests passed`;
        for (const result of results) {
            const div = document.createElement('div');
            div.textContent = `${result.status}: ${result.name}${result.error ? ` — ${result.error}` : ''}`;
            resultsEl.append(div);
        }
        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', (passed + failed).toString());
    </script>
</body>
</html>
