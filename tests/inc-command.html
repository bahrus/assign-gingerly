<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignGingerly - += Command Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignGingerly - += Command Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0"></div>

    <script type="module">
        import assignGingerly from '../assignGingerly.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toBeCloseTo(expected, precision = 2) {
                    const diff = Math.abs(actual - expected);
                    const tolerance = Math.pow(10, -precision) / 2;
                    if (diff > tolerance) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                }
            };
        }

        // Run all tests
        test('should increment existing numeric value', () => {
            const obj = { value: 10 };
            assignGingerly(obj, { 'value +=': 5 });
            expect(obj.value).toBe(15);
        });

        test('should increment negative values', () => {
            const obj = { count: 20 };
            assignGingerly(obj, { 'count +=': -5 });
            expect(obj.count).toBe(15);
        });

        test('should increment decimal values', () => {
            const obj = { price: 10.5 };
            assignGingerly(obj, { 'price +=': 2.5 });
            expect(obj.price).toBe(13);
        });

        test('should handle non-existent path - direct assignment', () => {
            const obj = { a: { b: {} } };
            assignGingerly(obj, { '?.a?.b?.c +=': 5 });
            expect(obj.a.b.c).toBe(5);
        });

        test('should handle non-existent path with nested notation', () => {
            const obj = {};
            assignGingerly(obj, { '?.x?.y?.z +=': 10 });
            expect(obj.x.y.z).toBe(10);
        });

        test('should create intermediate nested structures', () => {
            const obj = {};
            assignGingerly(obj, { '?.a?.b?.c +=': 7 });
            expect(obj).toEqual({
                a: {
                    b: {
                        c: 7
                    }
                }
            });
        });

        test('should handle README example', () => {
            const obj = {
                a: {
                    b: {
                        c: 2
                    }
                }
            };
            assignGingerly(obj, {
                '?.a?.b?.c +=': 3,
                '?.a?.d?.e +=': -2
            });
            expect(obj).toEqual({
                a: {
                    b: { c: 5 },
                    d: { e: -2 }
                }
            });
        });

        test('should handle multiple += commands on same object', () => {
            const obj = { x: 1, y: 2, z: 3 };
            assignGingerly(obj, {
                'x +=': 10,
                'y +=': 20,
                'z +=': 30
            });
            expect(obj).toEqual({
                x: 11,
                y: 22,
                z: 33
            });
        });

        test('should parse numeric string and add when LHS is number', () => {
            const obj = { value: 5 };
            assignGingerly(obj, { 'value +=': '3' });
            expect(obj.value).toBe(8);
        });

        test('should parse numeric string LHS and preserve it as a string', () => {
            const obj = { value: '12' };
            assignGingerly(obj, { 'value +=': 13 });
            expect(obj.value).toBe('25');
        });

        test('should increment a numeric dataset value', () => {
            const button = document.createElement('button');
            button.dataset.diff = '12';
            assignGingerly(button, {
                dataset: {
                    '?.diff +=': 13
                }
            });
            expect(button.dataset.diff).toBe('25');
        });

        test('should concatenate a non-numeric string LHS with a number', () => {
            const obj = { value: '12px' };
            assignGingerly(obj, { 'value +=': 13 });
            expect(obj.value).toBe('12px13');
        });

        test('should concatenate when LHS is number and RHS is non-numeric string', () => {
            const obj = { value: 5 };
            assignGingerly(obj, { 'value +=': 'px' });
            expect(obj.value).toBe('5px');
        });

        test('should handle incrementing with zero', () => {
            const obj = { count: 100 };
            assignGingerly(obj, { 'count +=': 0 });
            expect(obj.count).toBe(100);
        });

        test('should preserve nested object structure when incrementing', () => {
            const obj = { data: { nested: { count: 5, name: 'test' } } };
            assignGingerly(obj, { '?.data?.nested?.count +=': 3 });
            expect(obj.data.nested).toEqual({
                count: 8,
                name: 'test'
            });
        });

        test('should handle += with existing nested paths', () => {
            const obj = { a: { b: { c: 10 } } };
            assignGingerly(obj, { '?.a?.b?.c +=': 5 });
            expect(obj.a.b.c).toBe(15);
        });

        test('should mix += with regular assignments', () => {
            const obj = { existing: 10 };
            assignGingerly(obj, {
                'existing +=': 5,
                newProp: 'value'
            });
            expect(obj).toEqual({
                existing: 15,
                newProp: 'value'
            });
        });

        test('should mix += with nested path assignments', () => {
            const obj = {};
            assignGingerly(obj, {
                '?.counter +=': 1,
                '?.config?.setting': 'enabled'
            });
            expect(obj).toEqual({
                counter: 1,
                config: {
                    setting: 'enabled'
                }
            });
        });

        test('should handle very deeply nested += paths', () => {
            const obj = {};
            assignGingerly(obj, { '?.a?.b?.c?.d?.e?.f?.g?.h +=': 42 });
            expect(obj.a.b.c.d.e.f.g.h).toBe(42);
        });

        test('should handle special characters in property names', () => {
            const obj = {};
            assignGingerly(obj, { '?.style?.background-color +=': 100 });
            expect(obj.style['background-color']).toBe(100);
        });

        test('should allow negative direct assignments for non-existent paths', () => {
            const obj = {};
            assignGingerly(obj, { '?.value +=': -50 });
            expect(obj.value).toBe(-50);
        });

        test('should handle sequential += calls on same path', () => {
            const obj = { count: 0 };
            assignGingerly(obj, { 'count +=': 5 });
            assignGingerly(obj, { 'count +=': 3 });
            expect(obj.count).toBe(8);
        });

        test('should preserve array properties when incrementing other properties', () => {
            const obj = { items: [1, 2, 3], counter: 5 };
            assignGingerly(obj, { 'counter +=': 2 });
            expect(obj).toEqual({
                items: [1, 2, 3],
                counter: 7
            });
        });

        test('should increment with floating point arithmetic', () => {
            const obj = { total: 0.1 };
            assignGingerly(obj, { 'total +=': 0.2 });
            expect(obj.total).toBeCloseTo(0.3);
        });

        test('should increment each item with @each and literal RHS', () => {
            const obj = {
                items: [{ count: 1 }, { count: 2 }, { count: 3 }]
            };
            assignGingerly(obj, {
                '?.items?.@each?.count +=': 10
            });
            expect(obj.items[0].count).toBe(11);
            expect(obj.items[1].count).toBe(12);
            expect(obj.items[2].count).toBe(13);
        });

        test('should increment each item with nested @each', () => {
            const obj = {
                groups: [
                    { items: [{ count: 1 }, { count: 2 }] },
                    { items: [{ count: 3 }, { count: 4 }] }
                ]
            };
            assignGingerly(obj, {
                '?.groups?.@each?.items?.@each?.count +=': 100
            });
            expect(obj.groups[0].items[0].count).toBe(101);
            expect(obj.groups[0].items[1].count).toBe(102);
            expect(obj.groups[1].items[0].count).toBe(103);
            expect(obj.groups[1].items[1].count).toBe(104);
        });

        test('should preserve other properties when incrementing with @each', () => {
            const obj = {
                items: [
                    { count: 1, name: 'a' },
                    { count: 2, name: 'b' }
                ]
            };
            assignGingerly(obj, {
                '?.items?.@each?.count +=': 1
            });
            expect(obj.items[0]).toEqual({ count: 2, name: 'a' });
            expect(obj.items[1]).toEqual({ count: 3, name: 'b' });
        });

        // Display results
        const total = passed + failed;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');

        statusEl.innerHTML = `<span class="${failed === 0 ? 'pass' : 'fail'}">${passed}/${total} tests passed</span>`;

        results.forEach(result => {
            const div = document.createElement('div');
            div.className = `test-item ${result.status}`;
            div.innerHTML = `<strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}${result.error ? `<div class="error">${result.error}</div>` : ''}`;
            resultsEl.appendChild(div);
        });

        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', total.toString());

        console.log(`Tests complete: ${passed}/${total} passed`);
    </script>
</body>
</html>
