<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignGingerly - README Examples Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignGingerly - README Examples Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0"></div>

    <script type="module">
        import assignGingerly, { EnhancementRegistry } from '../assignGingerly.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toBeDefined() {
                    if (actual === undefined) {
                        throw new Error('Expected value to be defined');
                    }
                }
            };
        }

        // Run all tests
        test('Example 1: Basic assignment (superset of Object.assign)', () => {
            const sourceObj = { hello: 'world' };
            assignGingerly(sourceObj, { hello: 'Venus', foo: 'bar' });
            expect(sourceObj).toEqual({ hello: 'Venus', foo: 'bar' });
        });

        test('Example 2: Merging into existing sub object', () => {
            const oInput = {
                style: {
                    height: undefined
                }
            };
            assignGingerly(oInput, { '?.style?.height': '15px' });
            expect(oInput.style.height).toBe('15px');
        });

        test('Example 3: Deeply nested object creation', () => {
            const obj = {};
            assignGingerly(obj, {
                '?.style?.height': '15px',
                '?.a?.b?.c': {
                    d: 'hello',
                    e: 'world'
                }
            });
            expect(obj).toEqual({
                style: { height: '15px' },
                a: {
                    b: {
                        c: {
                            d: 'hello',
                            e: 'world'
                        }
                    }
                }
            });
        });

        test('Example 4: Dependency injection with symbols', () => {
            const isHappy = Symbol.for('TFWsx0YH5E6eSfhE7zfLxA');
            const isMellow = Symbol.for('BqnnTPWRHkWdVGWcGQoAiw');
            
            class MyEnhancement {
                isHappy = false;
            }

            class YourEnhancement {
                isMellow = false;
                madAboutFourteen = false;
            }
            
            const baseRegistry = new EnhancementRegistry();
            baseRegistry.push([
                {
                    symlinks: { [isHappy]: 'isHappy' },
                    spawn: MyEnhancement
                },
                {
                    symlinks: { [isMellow]: 'isMellow', madAboutFourteen: 'madAboutFourteen' },
                    spawn: YourEnhancement
                }
            ]);
            
            const result = assignGingerly({}, {
                [isHappy]: true,
                [isMellow]: true,
                '?.style?.height': '40px',
                '?.enhancements?.mellowYellow?.madAboutFourteen': true
            }, {
                registry: baseRegistry
            });
            
            expect(result).toBeDefined();
            expect(result.style?.height).toBe('40px');
            expect(result.enhancements?.mellowYellow?.madAboutFourteen).toBe(true);
            expect('set' in result).toBe(true);
        });

        test('Example 4 extended: Using set property for lazy assignment', () => {
            const isMellow = Symbol.for('BqnnTPWRHkWdVGWcGQoAiw');
            
            class YourEnhancement {
                isMellow = false;
            }
            
            const baseRegistry = new EnhancementRegistry();
            baseRegistry.push({
                symlinks: { [isMellow]: 'isMellow' },
                spawn: YourEnhancement
            });
            
            const result = assignGingerly({}, {}, { registry: baseRegistry });
            result.set[isMellow] = false;
            expect(result).toBeDefined();
        });

        test('Combining all features: nested paths + dependencies', () => {
            const enhSym = Symbol.for('enhancement');
            
            class Enhancement {
                enabled = false;
                config = {};
            }
            
            const registry = new EnhancementRegistry();
            registry.push({
                symlinks: { [enhSym]: 'enabled' },
                spawn: Enhancement
            });
            
            const target = {};
            assignGingerly(target, {
                [enhSym]: true,
                '?.app?.name': 'MyApp',
                '?.app?.version': '1.0.0',
                '?.settings?.debug': false,
                '?.database?.host': 'localhost',
                '?.database?.port': 5432
            }, {
                registry
            });
            
            expect(target).toBeDefined();
            expect(target.app?.name).toBe('MyApp');
            expect(target.app?.version).toBe('1.0.0');
            expect(target.settings?.debug).toBe(false);
            expect(target.database?.host).toBe('localhost');
            expect(target.database?.port).toBe(5432);
        });

        // Display results
        const total = passed + failed;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');

        statusEl.innerHTML = `<span class="${failed === 0 ? 'pass' : 'fail'}">${passed}/${total} tests passed</span>`;

        results.forEach(result => {
            const div = document.createElement('div');
            div.className = `test-item ${result.status}`;
            div.innerHTML = `<strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}${result.error ? `<div class="error">${result.error}</div>` : ''}`;
            resultsEl.appendChild(div);
        });

        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', total.toString());

        console.log(`Tests complete: ${passed}/${total} passed`);
    </script>
</body>
</html>
