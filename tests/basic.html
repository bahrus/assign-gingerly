<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>assignGingerly - Basic Functionality Tests</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-results { display: none; }
        .status { font-size: 24px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .test-item { padding: 8px; margin: 4px 0; border-left: 3px solid #ddd; }
        .test-item.pass { border-left-color: green; background: #f0fff0; }
        .test-item.fail { border-left-color: red; background: #fff0f0; }
        .error { color: red; font-family: monospace; font-size: 0.9em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>assignGingerly - Basic Functionality Tests</h1>
    <div class="status" id="status">Running tests...</div>
    <div id="results"></div>
    
    <!-- This element signals test completion to Playwright -->
    <div id="test-complete" data-passed="0" data-failed="0" data-total="0" style="display:none;"></div>

    <script type="module">
        import assignGingerly, { EnhancementRegistry } from '../assignGingerly.js';

        const results = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn) {
            try {
                fn();
                passed++;
                results.push({ name, status: 'pass' });
            } catch (error) {
                failed++;
                results.push({ name, status: 'fail', error: error.message });
            }
        }

        function expect(actual) {
            return {
                toEqual(expected) {
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                        throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
                    }
                },
                toBe(expected) {
                    if (actual !== expected) {
                        throw new Error(`Expected ${expected} but got ${actual}`);
                    }
                },
                toBeNull() {
                    if (actual !== null) {
                        throw new Error(`Expected null but got ${actual}`);
                    }
                }
            };
        }

        // Run all tests
        test('Example 1: Basic object assignment (like Object.assign)', () => {
            const sourceObj = { hello: 'world' };
            assignGingerly(sourceObj, { hello: 'Venus', foo: 'bar' });
            
            expect(sourceObj).toEqual({
                hello: 'Venus',
                foo: 'bar'
            });
        });

        test('should handle empty source object', () => {
            const target = { existing: 'value' };
            assignGingerly(target, {});
            
            expect(target).toEqual({ existing: 'value' });
        });

        test('should handle multiple key-value pairs', () => {
            const target = {};
            assignGingerly(target, {
                name: 'John',
                age: 30,
                email: 'john@example.com'
            });
            
            expect(target).toEqual({
                name: 'John',
                age: 30,
                email: 'john@example.com'
            });
        });

        test('should preserve existing properties when adding new ones', () => {
            const target = { existing: 'value' };
            assignGingerly(target, { new: 'property' });
            
            expect(target).toEqual({
                existing: 'value',
                new: 'property'
            });
        });

        test('should overwrite existing properties', () => {
            const target = { prop: 'old' };
            assignGingerly(target, { prop: 'new' });
            
            expect(target.prop).toBe('new');
        });

        test('should handle non-object values gracefully', () => {
            const result = assignGingerly(null, { test: 'value' });
            expect(result).toBeNull();
        });

        test('should handle non-object source', () => {
            const target = { existing: 'value' };
            assignGingerly(target, {});
            
            expect(target).toEqual({ existing: 'value' });
        });

        // Display results
        const total = passed + failed;
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const completeEl = document.getElementById('test-complete');

        statusEl.innerHTML = `
            <span class="${failed === 0 ? 'pass' : 'fail'}">
                ${passed}/${total} tests passed
            </span>
        `;

        results.forEach(result => {
            const div = document.createElement('div');
            div.className = `test-item ${result.status}`;
            div.innerHTML = `
                <strong>${result.status === 'pass' ? '✓' : '✗'}</strong> ${result.name}
                ${result.error ? `<div class="error">${result.error}</div>` : ''}
            `;
            resultsEl.appendChild(div);
        });

        // Signal completion to Playwright
        completeEl.setAttribute('data-passed', passed.toString());
        completeEl.setAttribute('data-failed', failed.toString());
        completeEl.setAttribute('data-total', total.toString());
        completeEl.style.display = 'block';

        console.log(`Tests complete: ${passed}/${total} passed`);
    </script>
</body>
</html>
