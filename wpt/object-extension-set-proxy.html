<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Proxy Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .test-section h3 {
      margin-top: 0;
    }
    .pass {
      color: green;
      font-weight: bold;
    }
    .fail {
      color: red;
      font-weight: bold;
    }
    .result {
      margin: 10px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Set Proxy Test</h1>
  <p>This test requires Chrome 146+ with scoped custom element registry support.</p>
  
  <div id="results"></div>

  <script type="module">
    import '../object-extension.js';
    import { BaseRegistry } from '../assignGingerly.js';

    const results = document.getElementById('results');

    function addResult(title, passed, message) {
      const section = document.createElement('div');
      section.className = 'test-section';
      section.innerHTML = `
        <h3>${title}</h3>
        <div class="result">
          <span class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span>
          <p>${message}</p>
        </div>
      `;
      results.appendChild(section);
    }

    // Test Enhancement Class
    class MyEnhancement {
      element;
      ctx;
      myProp = null;
      anotherProp = null;

      constructor(oElement, ctx, initVals) {
        this.element = oElement;
        this.ctx = ctx;
        if (initVals) {
          Object.assign(this, initVals);
        }
      }
    }

    // Test Enhancement Class 2
    class YourEnhancement {
      element;
      ctx;
      value = null;

      constructor(oElement, ctx, initVals) {
        this.element = oElement;
        this.ctx = ctx;
        if (initVals) {
          Object.assign(this, initVals);
        }
      }
    }

    try {
      const div = document.createElement('div');
      const hasCustomElementRegistry = 'customElementRegistry' in div;
      
      if (!hasCustomElementRegistry) {
        addResult(
          'Browser Support',
          false,
          'This browser does not support customElementRegistry on elements. Chrome 146+ required.'
        );
      } else {
        // Test 1: Element has 'set' property
        const hasSetProperty = 'set' in div;
        addResult(
          'Test 1: Element has "set" property',
          hasSetProperty,
          hasSetProperty 
            ? 'Element.prototype has "set" property'
            : 'Element.prototype does NOT have "set" property'
        );

        // Test 2: Set up registry with enhKey
        const testDiv = document.createElement('div');
        const registry = testDiv.customElementRegistry.assignGingerlyRegistry;
        
        registry.push({
          spawn: MyEnhancement,
          symlinks: {},
          enhKey: 'myEnh'
        });

        // Test 3: Access via set proxy spawns enhancement
        testDiv.set.myEnh.myProp = 'hello';
        
        const isMyEnhancement = testDiv.myEnh instanceof MyEnhancement;
        const hasCorrectValue = testDiv.myEnh.myProp === 'hello';
        const hasElement = testDiv.myEnh.element === testDiv;
        const hasContext = testDiv.myEnh.ctx && testDiv.myEnh.ctx.mountInfo;
        
        addResult(
          'Test 2: set.myEnh spawns MyEnhancement instance',
          isMyEnhancement && hasCorrectValue && hasElement && hasContext,
          `Instance check: ${isMyEnhancement}, Value: ${testDiv.myEnh.myProp}, ` +
          `Element ref: ${hasElement}, Context: ${hasContext}`
        );

        // Test 4: Subsequent access returns same instance
        testDiv.set.myEnh.anotherProp = 'world';
        const sameInstance = testDiv.myEnh.myProp === 'hello' && testDiv.myEnh.anotherProp === 'world';
        
        addResult(
          'Test 3: Subsequent access uses same instance',
          sameInstance,
          sameInstance
            ? 'Same instance reused, both properties set correctly'
            : 'Different instance or properties not set correctly'
        );

        // Test 5: No registry item - creates plain object
        const testDiv2 = document.createElement('div');
        testDiv2.set.plainObj.prop = 'value';
        
        const isPlainObject = testDiv2.plainObj && 
                              !(testDiv2.plainObj instanceof MyEnhancement) &&
                              testDiv2.plainObj.prop === 'value';
        
        addResult(
          'Test 4: No registry item creates plain object',
          isPlainObject,
          isPlainObject
            ? 'Plain object created and property set'
            : 'Plain object not created correctly'
        );

        // Test 6: initVals passed when property exists but wrong type
        const testDiv3 = document.createElement('div');
        const registry3 = testDiv3.customElementRegistry.assignGingerlyRegistry;
        
        registry3.push({
          spawn: YourEnhancement,
          symlinks: {},
          enhKey: 'yourEnh'
        });

        // Set a plain object first
        testDiv3.yourEnh = { value: 'initial', extra: 'data' };
        
        // Now access via set proxy - should spawn with initVals
        testDiv3.set.yourEnh.value = 'updated';
        
        const isYourEnhancement = testDiv3.yourEnh instanceof YourEnhancement;
        const hasInitialValue = testDiv3.yourEnh.extra === 'data';
        const hasUpdatedValue = testDiv3.yourEnh.value === 'updated';
        
        addResult(
          'Test 5: initVals passed when property exists but wrong type',
          isYourEnhancement && hasInitialValue && hasUpdatedValue,
          `Instance: ${isYourEnhancement}, InitVals preserved: ${hasInitialValue}, ` +
          `Updated: ${hasUpdatedValue}`
        );

        // Test 7: Multiple enhancements on same element
        const testDiv4 = document.createElement('div');
        const registry4 = testDiv4.customElementRegistry.assignGingerlyRegistry;
        
        registry4.push([
          {
            spawn: MyEnhancement,
            symlinks: {},
            enhKey: 'enh1'
          },
          {
            spawn: YourEnhancement,
            symlinks: {},
            enhKey: 'enh2'
          }
        ]);

        testDiv4.set.enh1.myProp = 'first';
        testDiv4.set.enh2.value = 'second';
        
        const hasEnh1 = testDiv4.enh1 instanceof MyEnhancement && testDiv4.enh1.myProp === 'first';
        const hasEnh2 = testDiv4.enh2 instanceof YourEnhancement && testDiv4.enh2.value === 'second';
        
        addResult(
          'Test 6: Multiple enhancements on same element',
          hasEnh1 && hasEnh2,
          hasEnh1 && hasEnh2
            ? 'Both enhancements created and work independently'
            : 'Multiple enhancements not working correctly'
        );

        // Test 8: Nested property access
        const testDiv5 = document.createElement('div');
        const registry5 = testDiv5.customElementRegistry.assignGingerlyRegistry;
        
        registry5.push({
          spawn: MyEnhancement,
          symlinks: {},
          enhKey: 'nested'
        });

        testDiv5.set.nested.myProp = 'level1';
        testDiv5.nested.anotherProp = 'level2';
        
        const nestedWorks = testDiv5.nested instanceof MyEnhancement &&
                           testDiv5.nested.myProp === 'level1' &&
                           testDiv5.nested.anotherProp === 'level2';
        
        addResult(
          'Test 7: Nested property access works',
          nestedWorks,
          nestedWorks
            ? 'Can set properties via set proxy and directly'
            : 'Nested property access not working'
        );

        // Test 9: findByEnhKey method
        const testRegistry = new BaseRegistry();
        const testItem = {
          spawn: MyEnhancement,
          symlinks: {},
          enhKey: 'testKey'
        };
        testRegistry.push(testItem);
        
        const foundItem = testRegistry.findByEnhKey('testKey');
        const notFoundItem = testRegistry.findByEnhKey('nonexistent');
        
        addResult(
          'Test 8: BaseRegistry.findByEnhKey method',
          foundItem === testItem && notFoundItem === undefined,
          foundItem === testItem && notFoundItem === undefined
            ? 'findByEnhKey correctly finds and returns undefined for missing keys'
            : 'findByEnhKey not working correctly'
        );
      }
    } catch (error) {
      addResult(
        'Error',
        false,
        `An error occurred: ${error.message}\n${error.stack}`
      );
    }
  </script>
</body>
</html>
