<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Object.prototype.assignGingerly edge cases</title>
    <link rel="help" href="https://github.com/bahrus/assign-gingerly">
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script type="module">
    import assignGingerly from '../object-extension.js';

    test(() => {
        const target = {};
        target.assignGingerly({ items: [1, 2, 3] });
        
        assert_true(Array.isArray(target.items), 'should preserve array type');
        assert_array_equals(target.items, [1, 2, 3], 'should not recurse into arrays');
    }, 'Object.prototype.assignGingerly should handle arrays as values');

    test(() => {
        const target = {};
        target.assignGingerly({ data: [1, 2, { nested: 'value' }] });
        
        assert_true(Array.isArray(target.data), 'array should remain an array');
        assert_equals(target.data[2].nested, 'value', 'should preserve array contents');
    }, 'Object.prototype.assignGingerly should not recurse into array elements');

    test(() => {
        const target = {};
        target.assignGingerly({
            count: 42,
            price: 19.99,
            zero: 0
        });
        
        assert_equals(target.count, 42, 'should handle positive numbers');
        assert_equals(target.price, 19.99, 'should handle decimal numbers');
        assert_equals(target.zero, 0, 'should handle zero');
    }, 'Object.prototype.assignGingerly should handle numeric values');

    test(() => {
        const target = {};
        target.assignGingerly({
            active: true,
            disabled: false
        });
        
        assert_true(target.active, 'should handle true values');
        assert_false(target.disabled, 'should handle false values');
    }, 'Object.prototype.assignGingerly should handle boolean values');

    test(() => {
        const target = {};
        target.assignGingerly({
            nullValue: null,
            undefinedValue: undefined
        });
        
        assert_equals(target.nullValue, null, 'should handle null');
        assert_equals(target.undefinedValue, undefined, 'should handle undefined');
    }, 'Object.prototype.assignGingerly should handle null and undefined');

    test(() => {
        const target = {};
        target.assignGingerly({
            text: 'hello',
            emoji: '🚀',
            empty: ''
        });
        
        assert_equals(target.text, 'hello', 'should handle regular strings');
        assert_equals(target.emoji, '🚀', 'should handle emoji');
        assert_equals(target.empty, '', 'should handle empty strings');
    }, 'Object.prototype.assignGingerly should handle string values');

    test(() => {
        const target = {};
        target.assignGingerly({
            app: {
                settings: {
                    theme: 'dark',
                    language: 'en'
                },
                users: [
                    { id: 1, name: 'Alice' },
                    { id: 2, name: 'Bob' }
                ]
            }
        });
        
        assert_equals(target.app.settings.theme, 'dark', 'should handle complex nested structures');
        assert_equals(target.app.users[0].name, 'Alice', 'should preserve array contents in nested structures');
    }, 'Object.prototype.assignGingerly should handle complex nested structures');

    test(() => {
        const target = {};
        target.assignGingerly({ '?.a?.b?.c?.d?.e?.f?.g?.h': 'deep-value' });
        
        assert_equals(target.a.b.c.d.e.f.g.h, 'deep-value', 'should handle very deep nesting');
    }, 'Object.prototype.assignGingerly should handle very deeply nested paths');

    test(() => {
        const target = {};
        target.assignGingerly({ '?.style?.background-color': '#ff0000' });
        
        assert_equals(target.style['background-color'], '#ff0000', 'should handle special characters in property names');
    }, 'Object.prototype.assignGingerly should handle special characters in paths');

    test(() => {
        const target = {};
        target.assignGingerly({ str: 'text', num: 123 });
        
        assert_equals(typeof target.str, 'string', 'should preserve string type');
        assert_equals(typeof target.num, 'number', 'should preserve number type');
    }, 'Object.prototype.assignGingerly should maintain type information');

    test(() => {
        const target = { value: 'initial' };
        
        target.assignGingerly({ value: 'first' });
        assert_equals(target.value, 'first', 'should update value on first call');
        
        target.assignGingerly({ value: 'second' });
        assert_equals(target.value, 'second', 'should update value on second call');
    }, 'Object.prototype.assignGingerly should handle reassignments');

    test(() => {
        const target = { existing: 'value' };
        target.assignGingerly({});
        
        assert_equals(target.existing, 'value', 'should preserve values with empty source');
    }, 'Object.prototype.assignGingerly should handle empty source objects');

    test(() => {
        const target = {};
        
        target.assignGingerly({ a: 1 });
        assert_equals(target.a, 1, 'should apply first assignment');
        
        target.assignGingerly({ b: 2 });
        assert_equals(target.b, 2, 'should apply second assignment');
        
        target.assignGingerly({ '?.c?.d': 3 });
        assert_equals(target.c.d, 3, 'should apply third assignment');
        
        assert_equals(target.a, 1, 'should retain first assignment');
        assert_equals(target.b, 2, 'should retain second assignment');
    }, 'Object.prototype.assignGingerly should handle sequential calls');

    test(() => {
        const target = {};
        const source1 = { '?.nested': { a: 1 } };
        const source2 = { '?.nested': { b: 2 } };
        
        target.assignGingerly(source1);
        target.assignGingerly(source2);
        
        assert_equals(target.nested.a, 1, 'should retain first nested assignment');
        assert_equals(target.nested.b, 2, 'should add to second nested assignment');
    }, 'Object.prototype.assignGingerly should merge sequential nested assignments');

    test(() => {
        const obj1 = {};
        const obj2 = {};
        
        const result1 = obj1.assignGingerly({ value: 'obj1' });
        const result2 = obj2.assignGingerly({ value: 'obj2' });
        
        assert_equals(obj1.value, 'obj1', 'first object should have its value');
        assert_equals(obj2.value, 'obj2', 'second object should have its value');
        assert_equals(result1, obj1, 'should return first object');
        assert_equals(result2, obj2, 'should return second object');
    }, 'Object.prototype.assignGingerly should work independently on different objects');
</script>
</body>
</html>
